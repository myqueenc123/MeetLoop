<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b1120"
    >

    <title>MeetLoop - Random Video Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1120;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-2: #111827;
            --border: rgba(255, 255, 255, 0.09);
            --border-strong: rgba(255, 255, 255, 0.15);

            --blue: #2563eb;
            --blue-light: #3b82f6;

            --red: #ef4444;
            --green: #22c55e;
            --purple: #8b5cf6;

            --text: #f8fafc;
            --muted: #94a3b8;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.14),
                    transparent 28%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.12),
                    transparent 24%
                ),
                var(--bg);

            overflow: hidden;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 0 20px;

            background: rgba(17, 24, 39, 0.88);

            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            position: relative;
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 22px;
            font-weight: 800;

            white-space: nowrap;

            letter-spacing: -0.4px;
        }

        .brand-icon {
            display: inline-flex;

            width: 34px;
            height: 34px;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            box-shadow:
                0 6px 20px rgba(37, 99, 235, 0.28);
        }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 8px;

            min-width: 0;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 34px;

            padding: 7px 11px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid var(--border);

            color: var(--text);

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }

        .online {
            color: #86efac;
        }

        #statusBadge {
            color: #cbd5e1;
        }

        /* =========================
           AESTHETIC CALL TIMER
        ========================= */

        #callTimer {
            gap: 7px;

            padding-left: 11px;
            padding-right: 12px;

            color: #cbd5e1;

            transition:
                color 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        #callTimer .timer-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #64748b;

            flex: 0 0 auto;
        }

        #callTimer.active {
            color: #fecaca;

            background:
                linear-gradient(
                    135deg,
                    rgba(239, 68, 68, 0.16),
                    rgba(239, 68, 68, 0.06)
                );

            border-color:
                rgba(239, 68, 68, 0.25);

            box-shadow:
                0 0 0 1px
                rgba(239, 68, 68, 0.04),
                0 8px 25px
                rgba(239, 68, 68, 0.09);
        }

        #callTimer.active .timer-dot {
            background: var(--red);

            box-shadow:
                0 0 0 0 rgba(239, 68, 68, 0.7);

            animation:
                timerPulse 1.5s infinite;
        }

        #callTimer .timer-label {
            color: #94a3b8;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }

        #callTimer .timer-time {
            min-width: 58px;

            font-variant-numeric: tabular-nums;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.6px;
        }

        @keyframes timerPulse {
            0% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0.55);
            }

            70% {
                box-shadow:
                    0 0 0 7px
                    rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(239, 68, 68, 0);
            }
        }

        select {
            min-height: 34px;

            padding: 7px 10px;

            color: white;

            background: rgba(255, 255, 255, 0.055);

            border: 1px solid var(--border);
            border-radius: 9px;

            outline: none;

            cursor: pointer;
        }

        select:focus {
            border-color:
                rgba(59, 130, 246, 0.6);
        }

        /* =========================
           MAIN
        ========================= */

        .main-container {
            width: 100%;
            height: calc(100vh - 68px);

            display: flex;

            gap: 12px;

            padding: 12px;
        }

        .video-wrapper {
            flex: 1;
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .videos-grid {
            flex: 1;
            min-height: 0;

            display: flex;

            gap: 10px;
        }

        .video-box {
            position: relative;

            flex: 1;

            min-width: 0;
            min-height: 0;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #111827,
                    #000
                );

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.25);
        }

        video {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #000;

            border: 0;
            outline: 0;
        }

        #localVideo {
            transform: none;
        }

        #remoteVideo {
            cursor: pointer;
        }

        /* =========================
           VIDEO LABELS
        ========================= */

        .video-label {
            position: absolute;

            top: 10px;
            left: 10px;

            z-index: 4;

            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            color: #fff;

            background: rgba(0, 0, 0, 0.56);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 9px;

            font-size: 12px;
            font-weight: 700;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            pointer-events: none;
        }

        .status {
            position: absolute;

            left: 10px;
            bottom: 10px;

            z-index: 4;

            padding: 6px 10px;

            color: #e2e8f0;

            background: rgba(0, 0, 0, 0.56);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 9px;

            font-size: 11px;
            font-weight: 600;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            pointer-events: none;
        }

        .remote-audio-hint {
            position: absolute;

            right: 10px;
            bottom: 10px;

            z-index: 8;

            display: none;
            align-items: center;
            justify-content: center;

            min-height: 34px;

            padding: 7px 11px;

            border: 0;
            border-radius: 9px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-light)
                );

            box-shadow:
                0 7px 20px
                rgba(37, 99, 235, 0.28);

            cursor: pointer;

            font-size: 11px;
            font-weight: 800;
        }

        /* =========================
           SEARCH OVERLAY
        ========================= */

        .search-overlay {
            position: absolute;
            inset: 0;

            z-index: 10;

            display: none;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    rgba(2, 6, 23, 0.68),
                    rgba(2, 6, 23, 0.76)
                );

            backdrop-filter: blur(2px);
        }

        .search-box {
            min-width: 220px;

            padding: 20px;

            text-align: center;

            border-radius: 16px;

            background:
                rgba(15, 23, 42, 0.76);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, 0.28);
        }

        .spinner {
            width: 42px;
            height: 42px;

            margin: 0 auto 12px;

            border: 4px solid
                rgba(255, 255, 255, 0.12);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        #searchText {
            color: #e2e8f0;

            font-size: 13px;
            font-weight: 700;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           CONTROLS
        ========================= */

        .controls-bar {
            display: flex;

            gap: 8px;

            padding: 2px;
        }

        .btn {
            min-height: 46px;

            border: 1px solid
                rgba(255, 255, 255, 0.04);

            border-radius: 11px;

            padding: 11px 15px;

            color: white;

            background: var(--panel-2);

            cursor: pointer;

            font-size: 13px;
            font-weight: 800;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            user-select: none;

            transition:
                transform 0.12s ease,
                filter 0.2s ease,
                opacity 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        .btn-loop {
            flex: 1.5;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            box-shadow:
                0 7px 22px
                rgba(37, 99, 235, 0.18);
        }

        .btn-stop {
            flex: 1;

            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #ef4444
                );
        }

        .btn-toggle {
            flex: 1;

            background:
                rgba(255, 255, 255, 0.07);
        }

        .btn-flip {
            display: none;

            flex: 1;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6
                );
        }

        /* =========================
           CHAT
        ========================= */

        .chat-wrapper {
            width: 320px;
            max-width: 320px;
            min-height: 0;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background:
                rgba(17, 24, 39, 0.88);

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.22);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .chat-header {
            padding: 14px;

            border-bottom:
                1px solid var(--border);

            font-weight: 800;
            font-size: 13px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;

            overflow-y: auto;

            padding: 12px;

            overscroll-behavior: contain;
        }

        .message {
            margin-bottom: 10px;

            word-break: break-word;
        }

        .message-name {
            margin-bottom: 3px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 700;
        }

        .message-text {
            display: inline-block;

            max-width: 90%;

            padding: 8px 10px;

            background:
                rgba(255, 255, 255, 0.075);

            border:
                1px solid
                rgba(255, 255, 255, 0.04);

            border-radius: 10px;

            color: #f8fafc;

            font-size: 12px;

            white-space: pre-wrap;
        }

        .chat-input-area {
            display: flex;

            gap: 6px;

            padding: 9px;

            border-top:
                1px solid var(--border);
        }

        #chatInput {
            flex: 1;
            min-width: 0;

            min-height: 40px;

            padding: 9px 10px;

            background:
                rgba(2, 6, 23, 0.64);

            color: white;

            border:
                1px solid var(--border-strong);

            border-radius: 9px;

            outline: none;
        }

        #chatInput:focus {
            border-color:
                rgba(59, 130, 246, 0.55);
        }

        #sendBtn {
            min-width: 60px;

            border: 0;
            border-radius: 9px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-light)
                );

            cursor: pointer;

            font-size: 12px;
            font-weight: 800;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            body {
                height: 100dvh;

                overflow-y: auto;
                overflow-x: hidden;
            }

            header {
                min-height: 60px;
                height: auto;

                padding:
                    8px
                    10px;

                gap: 8px;
            }

            .brand {
                font-size: 17px;
            }

            .brand-icon {
                width: 30px;
                height: 30px;
                border-radius: 9px;
            }

            .header-right {
                gap: 4px;

                flex-wrap: wrap;
            }

            .badge {
                min-height: 30px;

                padding: 5px 8px;

                font-size: 10px;
            }

            #callTimer {
                gap: 5px;
            }

            #callTimer .timer-label {
                display: none;
            }

            #callTimer .timer-time {
                min-width: 49px;

                font-size: 10px;
            }

            #callTimer .timer-dot {
                width: 6px;
                height: 6px;
            }

            select {
                min-height: 30px;

                padding: 5px 7px;

                font-size: 10px;
            }

            .main-container {
                height: auto;
                min-height:
                    calc(100dvh - 60px);

                padding: 8px;

                gap: 9px;

                display: flex;
                flex-direction: column;
            }

            .video-wrapper {
                width: 100%;

                flex: none;

                gap: 8px;
            }

            .videos-grid {
                position: relative;

                width: 100%;

                height: min(
                    55dvh,
                    560px
                );

                min-height: 300px;

                display: block;
            }

            .video-box {
                position: absolute;

                border-radius: 13px;
            }

            .video-box:first-child {
                inset: 0;

                width: 100%;
                height: 100%;
            }

            .video-box:last-child {
                right: 10px;
                bottom: 10px;

                width: 31%;
                height: 30%;

                z-index: 6;

                border:
                    2px solid
                    rgba(255, 255, 255, 0.9);

                box-shadow:
                    0 8px 20px
                    rgba(0, 0, 0, 0.46);
            }

            .video-label {
                top: 7px;
                left: 7px;

                padding: 5px 7px;

                border-radius: 8px;

                font-size: 10px;
            }

            .status {
                left: 7px;
                bottom: 7px;

                padding: 5px 7px;

                border-radius: 8px;

                font-size: 9px;
            }

            .remote-audio-hint {
                right: 7px;
                bottom: 7px;

                min-height: 32px;

                padding: 6px 8px;

                border-radius: 8px;

                font-size: 10px;
            }

            .controls-bar {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 7px;

                padding: 0;
            }

            .btn {
                width: 100%;

                min-height: 48px;

                padding: 10px 6px;

                border-radius: 9px;

                font-size: 11px;
            }

            .btn-loop,
            .btn-stop,
            .btn-toggle {
                flex: none;
            }

            .btn-flip {
                display: flex;
            }

            .chat-wrapper {
                width: 100%;
                max-width: none;

                height: 250px;
                min-height: 250px;

                border-radius: 13px;
            }

            .chat-header {
                padding: 10px;

                font-size: 12px;
            }

            .chat-messages {
                padding: 9px;
            }

            .chat-input-area {
                padding: 8px;
            }

            #chatInput {
                min-height: 40px;

                padding: 9px;

                font-size: 12px;
            }

            #sendBtn {
                min-width: 62px;

                font-size: 11px;
            }
        }

        @media (max-width: 400px) {

            .brand {
                font-size: 15px;
            }

            .videos-grid {
                height: 48dvh;
                min-height: 270px;
            }

            .video-box:last-child {
                width: 34%;
                height: 30%;
            }

            .btn {
                min-height: 46px;
                font-size: 10.5px;
            }

            .chat-wrapper {
                height: 230px;
                min-height: 230px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        <span class="brand-icon">🔄</span>
        <span>MeetLoop</span>
    </div>

    <div class="header-right">

        <div class="badge online">
            🟢 Online:
            <span id="onlineCount">0</span>
        </div>

        <div
            class="badge"
            id="statusBadge"
        >
            Ready
        </div>

        <div
            class="badge"
            id="callTimer"
            aria-label="Call time"
        >
            <span class="timer-dot"></span>

            <span class="timer-label">
                LIVE
            </span>

            <span
                class="timer-time"
                id="callTimerValue"
            >
                00:00:00
            </span>
        </div>

        <select id="languageSelect">
            <option value="en">
                English
            </option>

            <option value="tl">
                Tagalog
            </option>
        </select>

    </div>

</header>


<div class="main-container">

    <div class="video-wrapper">

        <div class="videos-grid">

            <div class="video-box">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline
                    preload="auto"
                ></video>

                <div
                    class="video-label"
                    id="strangerLabel"
                >
                    👤 Stranger
                </div>

                <div
                    class="status"
                    id="remoteStatus"
                >
                    Waiting...
                </div>

                <button
                    class="remote-audio-hint"
                    id="remoteAudioHint"
                    type="button"
                >
                    🔊 Tap for sound
                </button>

                <div
                    class="search-overlay"
                    id="searchOverlay"
                >
                    <div class="search-box">

                        <div class="spinner"></div>

                        <div id="searchText">
                            Finding someone...
                        </div>

                    </div>
                </div>

            </div>


            <div class="video-box">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                    preload="auto"
                ></video>

                <div class="video-label">
                    🙂 You
                </div>

            </div>

        </div>


        <div class="controls-bar">

            <button
                class="btn btn-loop"
                id="loopBtn"
                type="button"
            >
                🔄 Start Loop
            </button>

            <button
                class="btn btn-stop"
                id="stopBtn"
                type="button"
                disabled
            >
                ⏹️ Stop
            </button>

            <button
                class="btn btn-toggle"
                id="micBtn"
                type="button"
            >
                🎙️ Mic On
            </button>

            <button
                class="btn btn-toggle"
                id="camBtn"
                type="button"
            >
                📷 Cam On
            </button>

            <button
                class="btn btn-flip"
                id="flipBtn"
                type="button"
            >
                🔄 Flip
            </button>

        </div>

    </div>


    <div class="chat-wrapper">

        <div class="chat-header">
            💬 Live Chat
        </div>

        <div
            class="chat-messages"
            id="chatMessages"
        >

            <div class="message">

                <div class="message-name">
                    System
                </div>

                <div class="message-text">
                    Welcome to MeetLoop!
                </div>

            </div>

        </div>

        <div class="chat-input-area">

            <input
                id="chatInput"
                type="text"
                placeholder="Type a message..."
                maxlength="300"
                autocomplete="off"
            >

            <button
                id="sendBtn"
                type="button"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>
"use strict";


/* =========================================
   SOCKET
========================================= */

const socket = io({
    transports: [
        "websocket",
        "polling"
    ],

    reconnection: true,

    reconnectionAttempts:
        Infinity,

    reconnectionDelay: 1000,

    reconnectionDelayMax: 5000
});


/* =========================================
   DOM
========================================= */

const localVideo =
    document.getElementById(
        "localVideo"
    );

const remoteVideo =
    document.getElementById(
        "remoteVideo"
    );

const loopBtn =
    document.getElementById(
        "loopBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const micBtn =
    document.getElementById(
        "micBtn"
    );

const camBtn =
    document.getElementById(
        "camBtn"
    );

const flipBtn =
    document.getElementById(
        "flipBtn"
    );

const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );

const searchText =
    document.getElementById(
        "searchText"
    );

const remoteStatus =
    document.getElementById(
        "remoteStatus"
    );

const onlineCount =
    document.getElementById(
        "onlineCount"
    );

const statusBadge =
    document.getElementById(
        "statusBadge"
    );

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const languageSelect =
    document.getElementById(
        "languageSelect"
    );

const remoteAudioHint =
    document.getElementById(
        "remoteAudioHint"
    );

const callTimer =
    document.getElementById(
        "callTimer"
    );

const callTimerValue =
    document.getElementById(
        "callTimerValue"
    );


/* =========================================
   WEBRTC
========================================= */

const rtcConfig = {

    iceServers: [

        {
            urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        },

        {
            urls:
                "stun:stun.cloudflare.com:3478"
        }

    ],

    iceCandidatePoolSize: 10,

    bundlePolicy:
        "max-bundle",

    rtcpMuxPolicy:
        "require",

    iceTransportPolicy:
        "all"
};


/* =========================================
   STATE
========================================= */

let localStream = null;

let peerConnection = null;

let dataChannel = null;

let pendingIceCandidates = [];

let remoteDescriptionSet = false;

let searching = false;

let connected = false;

let stopping = false;

let currentFacingMode =
    "user";

let connectionTimer = null;

let callTimerInterval = null;

let callStartTime = null;

let signalQueue =
    Promise.resolve();

let iceRestartAttempted =
    false;


/* =========================================
   UI HELPERS
========================================= */

function setStatus(
    text
) {
    statusBadge.textContent =
        text;
}


function setRemoteStatus(
    text
) {
    remoteStatus.textContent =
        text;
}


function showSearch(
    text
) {
    searchText.textContent =
        text;

    searchOverlay.style.display =
        "flex";
}


function hideSearch() {
    searchOverlay.style.display =
        "none";
}


function isMobile() {
    return window
        .matchMedia(
            "(max-width: 850px)"
        )
        .matches;
}


/* =========================================
   CALL TIMER
========================================= */

function formatCallTime(
    totalSeconds
) {

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    return (
        String(hours).padStart(
            2,
            "0"
        ) +
        ":" +
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        )
    );
}


function updateCallTimer() {

    if (!callStartTime) {

        callTimerValue.textContent =
            "00:00:00";

        return;
    }


    const elapsed =
        Math.max(
            0,
            Math.floor(
                (
                    Date.now() -
                    callStartTime
                ) / 1000
            )
        );


    callTimerValue.textContent =
        formatCallTime(
            elapsed
        );
}


function startCallTimer() {

    stopCallTimer();

    callStartTime =
        Date.now();

    callTimer.classList.add(
        "active"
    );

    updateCallTimer();

    callTimerInterval =
        setInterval(
            updateCallTimer,
            1000
        );
}


function stopCallTimer() {

    if (callTimerInterval) {

        clearInterval(
            callTimerInterval
        );

        callTimerInterval =
            null;
    }

    callStartTime =
        null;

    callTimer.classList.remove(
        "active"
    );

    callTimerValue.textContent =
        "00:00:00";
}


/* =========================================
   CONNECTION TIMER
========================================= */

function clearConnectionTimer() {

    if (connectionTimer) {

        clearTimeout(
            connectionTimer
        );

        connectionTimer =
            null;
    }
}


function startConnectionTimer() {

    clearConnectionTimer();


    connectionTimer =
        setTimeout(
            () => {

                if (
                    peerConnection &&
                    !connected
                ) {

                    console.warn(
                        "WebRTC connection timeout"
                    );

                    setRemoteStatus(
                        "Connection failed"
                    );

                    setStatus(
                        "Connection failed"
                    );

                    loopBtn.disabled =
                        false;

                    loopBtn.textContent =
                        "🔄 Start Loop";
                }

            },
            20000
        );
}


/* =========================================
   SIGNAL QUEUE
========================================= */

function queueSignal(
    callback
) {

    signalQueue =
        signalQueue
            .then(
                callback
            )
            .catch(
                error => {

                    console.error(
                        "Signal queue error:",
                        error
                    );
                }
            );

    return signalQueue;
}


/* =========================================
   MEDIA
========================================= */

async function startMedia() {

    if (localStream) {
        return true;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Camera and microphone are not supported by this browser."
        );

        return false;
    }


    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "user"
                        },

                        width: {
                            ideal: 1280,
                            max: 1920
                        },

                        height: {
                            ideal: 720,
                            max: 1080
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },

                    audio: {

                        echoCancellation:
                            true,

                        noiseSuppression:
                            true,

                        autoGainControl:
                            true
                    }

                });


        localVideo.srcObject =
            localStream;

        localVideo.muted =
            true;

        localVideo.autoplay =
            true;

        localVideo.playsInline =
            true;


        await localVideo
            .play()
            .catch(
                () => {}
            );


        currentFacingMode =
            "user";


        updateMediaButtons();


        setStatus(
            "Camera ready"
        );


        return true;

    } catch (error) {

        console.error(
            "getUserMedia error:",
            error
        );


        localStream =
            null;


        if (
            error.name ===
            "NotAllowedError"
        ) {

            alert(
                "Camera/microphone permission was denied. Allow Camera and Microphone in Chrome."
            );

        } else if (
            error.name ===
            "NotFoundError"
        ) {

            alert(
                "No camera or microphone was found."
            );

        } else if (
            error.name ===
            "NotReadableError"
        ) {

            alert(
                "Camera or microphone is already being used by another app."
            );

        } else {

            alert(
                "Hindi ma-access ang camera/microphone. I-check ang Chrome permissions."
            );
        }


        return false;
    }
}


function updateMediaButtons() {

    if (!localStream) {
        return;
    }


    const audioTrack =
        localStream
            .getAudioTracks()[0];


    const videoTrack =
        localStream
            .getVideoTracks()[0];


    if (audioTrack) {

        micBtn.textContent =
            audioTrack.enabled
                ? "🎙️ Mic On"
                : "🔇 Mic Off";
    }


    if (videoTrack) {

        camBtn.textContent =
            videoTrack.enabled
                ? "📷 Cam On"
                : "🚫 Cam Off";
    }
}


function toggleMic() {

    if (!localStream) {
        return;
    }


    const track =
        localStream
            .getAudioTracks()[0];


    if (!track) {
        return;
    }


    track.enabled =
        !track.enabled;


    updateMediaButtons();
}


function toggleCam() {

    if (!localStream) {
        return;
    }


    const track =
        localStream
            .getVideoTracks()[0];


    if (!track) {
        return;
    }


    track.enabled =
        !track.enabled;


    updateMediaButtons();
}


/* =========================================
   MOBILE CAMERA FLIP
========================================= */

async function flipCamera() {

    if (!isMobile()) {
        return;
    }


    if (!localStream) {
        return;
    }


    const oldTrack =
        localStream
            .getVideoTracks()[0];


    if (!oldTrack) {
        return;
    }


    const newFacingMode =
        currentFacingMode ===
            "user"
            ? "environment"
            : "user";


    let newStream =
        null;


    try {

        newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            exact:
                                newFacingMode
                        }
                    },

                    audio: false
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        if (!newTrack) {

            throw new Error(
                "No replacement camera track"
            );
        }


        newTrack.enabled =
            oldTrack.enabled;


        if (peerConnection) {

            const sender =
                peerConnection
                    .getSenders()
                    .find(
                        item =>
                            item.track &&
                            item.track.kind ===
                            "video"
                    );


            if (sender) {

                await sender
                    .replaceTrack(
                        newTrack
                    );
            }
        }


        localStream.removeTrack(
            oldTrack
        );

        localStream.addTrack(
            newTrack
        );


        oldTrack.stop();


        localVideo.srcObject =
            localStream;


        await localVideo
            .play()
            .catch(
                () => {}
            );


        currentFacingMode =
            newFacingMode;


        updateMediaButtons();

    } catch (error) {

        console.warn(
            "Exact camera flip failed:",
            error
        );


        if (newStream) {

            newStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        try {

            const fallbackStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {

                            facingMode: {
                                ideal:
                                    newFacingMode
                            }
                        },

                        audio: false
                    });


            const fallbackTrack =
                fallbackStream
                    .getVideoTracks()[0];


            if (!fallbackTrack) {
                throw new Error(
                    "No fallback track"
                );
            }


            fallbackTrack.enabled =
                oldTrack.enabled;


            if (peerConnection) {

                const sender =
                    peerConnection
                        .getSenders()
                        .find(
                            item =>
                                item.track &&
                                item.track.kind ===
                                "video"
                        );


                if (sender) {

                    await sender
                        .replaceTrack(
                            fallbackTrack
                        );
                }
            }


            localStream.removeTrack(
                oldTrack
            );

            localStream.addTrack(
                fallbackTrack
            );


            oldTrack.stop();


            localVideo.srcObject =
                localStream;


            await localVideo
                .play()
                .catch(
                    () => {}
                );


            currentFacingMode =
                newFacingMode;


            updateMediaButtons();

        } catch (
            fallbackError
        ) {

            console.error(
                "Camera flip failed:",
                fallbackError
            );

            alert(
                "Hindi ma-switch ang camera sa device mo."
            );
        }
    }
}


/* =========================================
   PEER CONNECTION
========================================= */

function createPeer(
    initiator
) {

    closePeerConnection();


    pendingIceCandidates =
        [];

    remoteDescriptionSet =
        false;

    iceRestartAttempted =
        false;


    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );
    }


    /* Remote tracks */

    peerConnection.ontrack =
        event => {

            console.log(
                "Remote track received:",
                event.track.kind
            );


            let remoteStream =
                remoteVideo.srcObject;


            if (
                event.streams &&
                event.streams[0]
            ) {

                remoteStream =
                    event.streams[0];

            } else if (
                !remoteStream
            ) {

                remoteStream =
                    new MediaStream();
            }


            if (
                event.streams.length === 0 &&
                !remoteStream
                    .getTracks()
                    .includes(
                        event.track
                    )
            ) {

                remoteStream.addTrack(
                    event.track
                );
            }


            remoteVideo.srcObject =
                remoteStream;


            remoteVideo.autoplay =
                true;

            remoteVideo.playsInline =
                true;


            remoteVideo
                .play()
                .then(
                    () => {

                        remoteAudioHint
                            .style.display =
                            "none";
                    }
                )
                .catch(
                    error => {

                        console.warn(
                            "Remote autoplay blocked:",
                            error
                        );

                        remoteAudioHint
                            .style.display =
                            "flex";
                    }
                );


            if (
                event.track.kind ===
                "video"
            ) {

                setRemoteStatus(
                    "Video connected"
                );
            }
        };


    /* ICE */

    peerConnection.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            socket.emit(
                "signal",
                {
                    type:
                        "candidate",

                    candidate:
                        event.candidate
                }
            );
        };


    peerConnection.oniceconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection
                    .iceConnectionState;


            console.log(
                "ICE state:",
                state
            );


            if (
                state === "checking"
            ) {

                setStatus(
                    "Connecting..."
                );
            }


            if (
                state === "connected" ||
                state === "completed"
            ) {

                setStatus(
                    "Connected"
                );
            }


            if (
                state === "failed" &&
                !iceRestartAttempted &&
                initiator
            ) {

                iceRestartAttempted =
                    true;


                try {

                    peerConnection
                        .restartIce();


                    createOffer(
                        true
                    );

                } catch (
                    error
                ) {

                    console.error(
                        "ICE restart error:",
                        error
                    );
                }
            }
        };


    /* Connection */

    peerConnection
        .onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            console.log(
                "Connection state:",
                state
            );


            if (
                state === "connecting"
            ) {

                setRemoteStatus(
                    "Connecting..."
                );
            }


            if (
                state === "connected"
            ) {

                connected =
                    true;

                searching =
                    false;

                clearConnectionTimer();

                hideSearch();


                setStatus(
                    "Connected"
                );

                setRemoteStatus(
                    "Connected"
                );


                loopBtn.disabled =
                    false;

                loopBtn.textContent =
                    "⏭️ Next";


                stopBtn.disabled =
                    false;


                /* Start unlimited timer */

                if (
                    !callStartTime
                ) {

                    startCallTimer();
                }
            }


            if (
                state === "failed"
            ) {

                connected =
                    false;

                stopCallTimer();


                setStatus(
                    "Connection failed"
                );

                setRemoteStatus(
                    "Connection failed"
                );


                loopBtn.disabled =
                    false;

                loopBtn.textContent =
                    "🔄 Start Loop";
            }


            if (
                state === "disconnected"
            ) {

                setRemoteStatus(
                    "Disconnected"
                );
            }
        };


    /* ICE gathering */

    peerConnection
        .onicegatheringstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            console.log(
                "ICE gathering:",
                peerConnection
                    .iceGatheringState
            );
        };


    /* Signaling */

    peerConnection
        .onsignalingstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            console.log(
                "Signaling state:",
                peerConnection
                    .signalingState
            );
        };


    /* Data channel */

    peerConnection
        .ondatachannel =
        event => {

            console.log(
                "Remote data channel received"
            );


            dataChannel =
                event.channel;


            setupDataChannel(
                dataChannel
            );
        };


    if (initiator) {

        dataChannel =
            peerConnection
                .createDataChannel(
                    "chat",
                    {
                        ordered:
                            true
                    }
                );


        setupDataChannel(
            dataChannel
        );


        createOffer(
            false
        );
    }


    startConnectionTimer();
}


/* =========================================
   OFFER
========================================= */

async function createOffer(
    iceRestart = false
) {

    if (!peerConnection) {
        return;
    }


    try {

        const offer =
            await peerConnection
                .createOffer(
                    iceRestart
                        ? {
                            iceRestart:
                                true
                        }
                        : undefined
                );


        await peerConnection
            .setLocalDescription(
                offer
            );


        socket.emit(
            "signal",
            {
                type:
                    "offer",

                offer:
                    peerConnection
                        .localDescription
            }
        );

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );
    }
}


/* =========================================
   ANSWER
========================================= */

async function handleOffer(
    offer
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {

                createPeer(
                    false
                );
            }


            if (!peerConnection) {
                return;
            }


            try {

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            offer
                        )
                    );


                remoteDescriptionSet =
                    true;


                await flushIceCandidates();


                const answer =
                    await peerConnection
                        .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                socket.emit(
                    "signal",
                    {
                        type:
                            "answer",

                        answer:
                            peerConnection
                                .localDescription
                    }
                );

            } catch (error) {

                console.error(
                    "Offer handling error:",
                    error
                );

                setRemoteStatus(
                    "Connection error"
                );
            }
        }
    );
}


/* =========================================
   ANSWER HANDLER
========================================= */

async function handleAnswer(
    answer
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {
                return;
            }


            try {

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            answer
                        )
                    );


                remoteDescriptionSet =
                    true;


                await flushIceCandidates();

            } catch (error) {

                console.error(
                    "Answer error:",
                    error
                );
            }
        }
    );
}


/* =========================================
   ICE CANDIDATES
========================================= */

async function handleCandidate(
    candidate
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {
                return;
            }


            try {

                if (
                    remoteDescriptionSet &&
                    peerConnection
                        .remoteDescription
                ) {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                } else {

                    pendingIceCandidates
                        .push(
                            candidate
                        );
                }

            } catch (error) {

                console.error(
                    "ICE candidate error:",
                    error
                );
            }
        }
    );
}


async function flushIceCandidates() {

    if (!peerConnection) {
        return;
    }


    const candidates =
        pendingIceCandidates;


    pendingIceCandidates =
        [];


    for (
        const candidate
        of candidates
    ) {

        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                "ICE flush error:",
                error
            );
        }
    }
}


/* =========================================
   CLOSE PEER
========================================= */

function closePeerConnection() {

    clearConnectionTimer();


    pendingIceCandidates =
        [];

    remoteDescriptionSet =
        false;


    signalQueue =
        Promise.resolve();


    if (dataChannel) {

        try {

            dataChannel.close();

        } catch (
            error
        ) {}

        dataChannel =
            null;
    }


    if (peerConnection) {

        try {

            peerConnection.ontrack =
                null;

            peerConnection.onicecandidate =
                null;

            peerConnection
                .onconnectionstatechange =
                null;

            peerConnection
                .oniceconnectionstatechange =
                null;

            peerConnection
                .ondatachannel =
                null;

            peerConnection.close();

        } catch (
            error
        ) {}
    }


    peerConnection =
        null;
}


/* =========================================
   START / NEXT
========================================= */

async function startLoop() {

    if (stopping) {
        return;
    }


    if (connected) {

        stopCallTimer();


        closePeerConnection();


        remoteVideo.srcObject =
            null;


        connected =
            false;

        searching =
            true;


        showSearch(
            "Finding someone..."
        );


        setRemoteStatus(
            "Searching..."
        );

        setStatus(
            "Searching..."
        );


        loopBtn.disabled =
            true;


        socket.emit(
            "skip"
        );


        return;
    }


    if (searching) {
        return;
    }


    const mediaReady =
        await startMedia();


    if (!mediaReady) {
        return;
    }


    searching =
        true;

    connected =
        false;

    stopping =
        false;


    loopBtn.disabled =
        true;

    stopBtn.disabled =
        false;


    showSearch(
        "Finding someone..."
    );


    setRemoteStatus(
        "Searching..."
    );

    setStatus(
        "Searching..."
    );


    socket.emit(
        "skip"
    );
}


/* =========================================
   STOP
========================================= */

function stopSession() {

    stopping =
        true;


    searching =
        false;

    connected =
        false;


    stopCallTimer();


    socket.emit(
        "stop-search"
    );


    closePeerConnection();


    remoteVideo.srcObject =
        null;


    remoteAudioHint.style.display =
        "none";


    hideSearch();


    setRemoteStatus(
        "Stopped"
    );


    setStatus(
        "Ready"
    );


    loopBtn.disabled =
        false;

    stopBtn.disabled =
        true;


    loopBtn.textContent =
        "🔄 Start Loop";


    setTimeout(
        () => {
            stopping =
                false;
        },
        150
    );
}


/* =========================================
   SOCKET EVENTS
========================================= */

socket.on(
    "connect",
    () => {

        console.log(
            "Socket connected:",
            socket.id
        );


        setStatus(
            connected
                ? "Connected"
                : "Ready"
        );
    }
);


socket.on(
    "connect_error",
    error => {

        console.error(
            "Socket connection error:",
            error
        );


        setStatus(
            "Server reconnecting..."
        );
    }
);


socket.on(
    "online-count",
    count => {

        onlineCount.textContent =
            String(count);
    }
);


socket.on(
    "waiting",
    () => {

        searching =
            true;


        showSearch(
            "Waiting for someone..."
        );


        setRemoteStatus(
            "Waiting..."
        );


        setStatus(
            "Waiting..."
        );
    }
);


socket.on(
    "match",
    data => {

        searching =
            false;

        connected =
            false;


        hideSearch();


        setRemoteStatus(
            "Connecting..."
        );


        setStatus(
            "Connecting..."
        );


        stopBtn.disabled =
            false;


        createPeer(
            Boolean(
                data &&
                data.initiator
            )
        );
    }
);


socket.on(
    "signal",
    data => {

        if (
            !data ||
            !data.type
        ) {
            return;
        }


        if (
            data.type ===
            "offer"
        ) {

            handleOffer(
                data.offer
            );

        } else if (
            data.type ===
            "answer"
        ) {

            handleAnswer(
                data.answer
            );

        } else if (
            data.type ===
            "candidate"
        ) {

            handleCandidate(
                data.candidate
            );
        }
    }
);


socket.on(
    "partner-disconnected",
    () => {

        connected =
            false;

        searching =
            false;


        stopCallTimer();


        closePeerConnection();


        remoteVideo.srcObject =
            null;

        remoteAudioHint
            .style.display =
            "none";


        hideSearch();


        setRemoteStatus(
            "Stranger left"
        );


        setStatus(
            "Ready"
        );


        loopBtn.disabled =
            false;

        stopBtn.disabled =
            true;


        loopBtn.textContent =
            "🔄 Start Loop";
    }
);


socket.on(
    "disconnect",
    reason => {

        console.warn(
            "Socket disconnected:",
            reason
        );


        if (!connected) {

            setStatus(
                "Reconnecting..."
            );
        }
    }
);


/* =========================================
   CHAT
========================================= */

function setupDataChannel(
    channel
) {

    if (!channel) {
        return;
    }


    channel.onopen =
        () => {

            console.log(
                "Chat connected"
            );

            setStatus(
                "Connected"
            );
        };


    channel.onclose =
        () => {

            console.log(
                "Chat disconnected"
            );
        };


    channel.onerror =
        error => {

            console.error(
                "Chat error:",
                error
            );
        };


    channel.onmessage =
        event => {

            addMessage(
                "Stranger",
                String(
                    event.data
                )
            );
        };
}


function sendMessage() {

    const text =
        chatInput.value.trim();


    if (!text) {
        return;
    }


    if (
        !dataChannel ||
        dataChannel.readyState !==
        "open"
    ) {

        addMessage(
            "System",
            "Connect to a stranger first."
        );

        return;
    }


    try {

        dataChannel.send(
            text
        );


        addMessage(
            "Me",
            text
        );


        chatInput.value =
            "";

    } catch (error) {

        console.error(
            "Send message error:",
            error
        );


        addMessage(
            "System",
            "Message could not be sent."
        );
    }
}


function addMessage(
    name,
    text
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message";


    const nameDiv =
        document.createElement(
            "div"
        );


    nameDiv.className =
        "message-name";

    nameDiv.textContent =
        name;


    const textDiv =
        document.createElement(
            "div"
        );


    textDiv.className =
        "message-text";

    textDiv.textContent =
        text;


    message.appendChild(
        nameDiv
    );

    message.appendChild(
        textDiv
    );


    chatMessages.appendChild(
        message
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


/* =========================================
   REMOTE AUDIO
========================================= */

async function playRemoteMedia() {

    try {

        remoteVideo.muted =
            false;


        await remoteVideo
            .play();


        remoteAudioHint
            .style.display =
            "none";

    } catch (error) {

        console.warn(
            "Remote playback failed:",
            error
        );
    }
}


remoteVideo.addEventListener(
    "click",
    () => {

        playRemoteMedia();
    }
);


remoteAudioHint.addEventListener(
    "click",
    () => {

        playRemoteMedia();
    }
);


/* =========================================
   BUTTON EVENTS
========================================= */

loopBtn.addEventListener(
    "click",
    startLoop
);


stopBtn.addEventListener(
    "click",
    stopSession
);


micBtn.addEventListener(
    "click",
    toggleMic
);


camBtn.addEventListener(
    "click",
    toggleCam
);


flipBtn.addEventListener(
    "click",
    flipCamera
);


sendBtn.addEventListener(
    "click",
    sendMessage
);


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================
   LANGUAGE
========================================= */

languageSelect.addEventListener(
    "change",
    event => {

        const lang =
            event.target.value;


        chatInput.placeholder =
            lang === "tl"
                ? "Mag-type ng message..."
                : "Type a message...";


        loopBtn.textContent =
            connected
                ? "⏭️ Next"
                : "🔄 Start Loop";
    }
);


/* =========================================
   ESCAPE
========================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Escape"
        ) {

            stopSession();
        }
    }
);


/* =========================================
   VISIBILITY
========================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                localStream &&
                localVideo.srcObject
            ) {

                localVideo
                    .play()
                    .catch(
                        () => {}
                    );
            }


            if (
                remoteVideo.srcObject &&
                connected
            ) {

                remoteVideo
                    .play()
                    .catch(
                        () => {}
                    );
            }
        }
    }
);


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            socket.emit(
                "stop-search"
            );

        } catch (
            error
        ) {}


        stopCallTimer();


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        closePeerConnection();
    }
);


/* =========================================
   INITIAL STATE
========================================= */

stopCallTimer();

setStatus(
    "Ready"
);

setRemoteStatus(
    "Waiting..."
);

stopBtn.disabled =
    true;

</script>
