<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MeetLoop - Random Video Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 64px;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #374151;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: #374151;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .online {
            color: #4ade80;
        }

        select {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 7px 10px;
        }

        .main-container {
            height: calc(100vh - 64px);
            display: flex;
            gap: 12px;
            padding: 12px;
        }

        .video-wrapper {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .videos-grid {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 10px;
        }

        .video-box {
            position: relative;
            flex: 1;
            min-width: 0;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #374151;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .video-label {
            position: absolute;
            left: 10px;
            top: 10px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 2;
        }

        #localVideo {
            transform: none;
        }

        .controls-bar {
            display: flex;
            gap: 8px;
            padding: 4px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-loop {
            background: #2563eb;
            flex: 1.5;
        }

        .btn-stop {
            background: #dc2626;
            flex: 1;
        }

        .btn-toggle {
            background: #374151;
            flex: 1;
        }

        .btn-flip {
            display: none;
            background: #7c3aed;
            flex: 1;
        }

        .search-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .search-box {
            text-align: center;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #374151;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: auto auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .chat-wrapper {
            width: 320px;
            max-width: 320px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 14px;
            font-weight: bold;
            border-bottom: 1px solid #374151;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .message {
            margin-bottom: 10px;
            word-wrap: break-word;
        }

        .message-name {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 3px;
        }

        .message-text {
            background: #374151;
            padding: 8px 10px;
            border-radius: 9px;
            display: inline-block;
            max-width: 90%;
        }

        .chat-input-area {
            display: flex;
            gap: 6px;
            padding: 10px;
            border-top: 1px solid #374151;
        }

        #chatInput {
            flex: 1;
            min-width: 0;
            background: #111827;
            color: white;
            border: 1px solid #4b5563;
            border-radius: 8px;
            padding: 10px;
            outline: none;
        }

        #sendBtn {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
        }

        .status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 2;
        }

        @media (max-width: 850px) {
            body {
                height: auto;
                min-height: 100dvh;
                overflow-y: auto;
            }

            header {
                height: auto;
                min-height: 58px;
                padding: 9px 12px;
                gap: 8px;
            }

            .brand {
                font-size: 18px;
            }

            .header-right {
                gap: 5px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .badge {
                padding: 5px 8px;
                font-size: 11px;
            }

            select {
                padding: 5px 7px;
                font-size: 11px;
            }

            .main-container {
                height: auto;
                min-height: calc(100dvh - 58px);
                display: flex;
                flex-direction: column;
                padding: 8px;
                gap: 9px;
            }

            .video-wrapper {
                flex: none;
                width: 100%;
                gap: 8px;
            }

            .videos-grid {
                position: relative;
                display: block;
                width: 100%;
                height: 53dvh;
                min-height: 300px;
                max-height: 560px;
            }

            .video-box {
                position: absolute;
                border-radius: 12px;
            }

            .video-box:first-child {
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .video-box:last-child {
                width: 31%;
                height: 30%;
                right: 10px;
                bottom: 10px;
                z-index: 3;
                border: 2px solid white;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            }

            .video-label {
                left: 7px;
                top: 7px;
                padding: 5px 7px;
                font-size: 11px;
            }

            .status {
                left: 7px;
                bottom: 7px;
                padding: 5px 7px;
                font-size: 10px;
            }

            .controls-bar {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
                padding: 0;
            }

            .btn {
                min-height: 46px;
                width: 100%;
                padding: 10px 7px;
                font-size: 12px;
                border-radius: 9px;
            }

            .btn-loop,
            .btn-stop,
            .btn-toggle {
                flex: none;
            }

            .btn-flip {
                display: flex;
            }

            .chat-wrapper {
                width: 100%;
                max-width: none;
                height: 220px;
                min-height: 220px;
                border-radius: 12px;
            }

            .chat-header {
                padding: 10px;
                font-size: 13px;
            }

            .chat-messages {
                padding: 9px;
            }

            .chat-input-area {
                padding: 8px;
            }

            #chatInput {
                padding: 9px;
            }

            #sendBtn {
                padding: 0 12px;
            }
        }

        @media (max-width: 400px) {
            .videos-grid {
                height: 48dvh;
                min-height: 270px;
            }

            .video-box:last-child {
                width: 34%;
                height: 30%;
            }

            .btn {
                font-size: 11px;
                min-height: 44px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">🔄 MeetLoop</div>

    <div class="header-right">
        <div class="badge online">
            🟢 Online: <span id="onlineCount">0</span>
        </div>

        <div class="badge" id="statusBadge">
            Ready
        </div>

        <select id="languageSelect">
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
        </select>
    </div>
</header>

<div class="main-container">

    <div class="video-wrapper">

        <div class="videos-grid">

            <div class="video-box">

                <video id="remoteVideo" autoplay playsinline></video>

                <div class="video-label" id="strangerLabel">
                    👤 Stranger
                </div>

                <div class="status" id="remoteStatus">
                    Waiting...
                </div>

                <div class="search-overlay" id="searchOverlay">
                    <div class="search-box">
                        <div class="spinner"></div>
                        <div id="searchText">
                            Finding someone...
                        </div>
                    </div>
                </div>

            </div>

            <div class="video-box">

                <video id="localVideo" autoplay muted playsinline></video>

                <div class="video-label">
                    🙂 You
                </div>

            </div>

        </div>

        <div class="controls-bar">

            <button
                class="btn btn-loop"
                id="loopBtn"
                onclick="toggleLoop()">
                🔄 Start Loop
            </button>

            <button
                class="btn btn-stop"
                id="stopBtn"
                onclick="stopSession()"
                disabled>
                ⏹️ Stop
            </button>

            <button
                class="btn btn-toggle"
                id="micBtn"
                onclick="toggleMic()">
                🎙️ Mic On
            </button>

            <button
                class="btn btn-toggle"
                id="camBtn"
                onclick="toggleCam()">
                📷 Cam On
            </button>

            <button
                class="btn btn-flip"
                id="flipBtn"
                onclick="flipCamera()">
                🔄 Flip
            </button>

        </div>

    </div>

    <div class="chat-wrapper">

        <div class="chat-header">
            💬 Live Chat
        </div>

        <div class="chat-messages" id="chatMessages">

            <div class="message">
                <div class="message-name">
                    System
                </div>

                <div class="message-text">
                    Welcome to MeetLoop!
                </div>
            </div>

        </div>

        <div class="chat-input-area">

            <input
                type="text"
                id="chatInput"
                placeholder="Type a message..."
                maxlength="300">

            <button
                id="sendBtn"
                onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
    const socket = io();

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    const loopBtn = document.getElementById("loopBtn");
    const stopBtn = document.getElementById("stopBtn");

    const micBtn = document.getElementById("micBtn");
    const camBtn = document.getElementById("camBtn");

    const searchOverlay = document.getElementById("searchOverlay");
    const searchText = document.getElementById("searchText");
    const remoteStatus = document.getElementById("remoteStatus");
    const onlineCount = document.getElementById("onlineCount");

    const chatInput = document.getElementById("chatInput");
    const chatMessages = document.getElementById("chatMessages");

    const rtcConfig = {
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            },
            {
                urls: "stun:stun1.l.google.com:19302"
            }
        ]
    };

    let localStream = null;
    let peerConnection = null;
    let dataChannel = null;

    let searching = false;
    let connected = false;

    let currentFacingMode = "user";
    let pendingIceCandidates = [];


    async function startMedia() {

        if (localStream) {
            return true;
        }

        try {

            localStream =
                await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user"
                    },
                    audio: true
                });

            localVideo.srcObject = localStream;

            currentFacingMode = "user";

            updateMediaButtons();

            return true;

        } catch (error) {

            console.error(
                "Camera/Microphone error:",
                error
            );

            alert(
                "Please allow camera and microphone permission to use MeetLoop."
            );

            return false;
        }
    }


    function updateMediaButtons() {

        if (!localStream) {
            return;
        }

        const audioTrack =
            localStream.getAudioTracks()[0];

        const videoTrack =
            localStream.getVideoTracks()[0];

        if (audioTrack) {

            micBtn.textContent =
                audioTrack.enabled
                    ? "🎙️ Mic On"
                    : "🔇 Mic Off";
        }

        if (videoTrack) {

            camBtn.textContent =
                videoTrack.enabled
                    ? "📷 Cam On"
                    : "🚫 Cam Off";
        }
    }


    function toggleMic() {

        if (!localStream) {
            return;
        }

        const track =
            localStream.getAudioTracks()[0];

        if (!track) {
            return;
        }

        track.enabled = !track.enabled;

        updateMediaButtons();
    }


    function toggleCam() {

        if (!localStream) {
            return;
        }

        const track =
            localStream.getVideoTracks()[0];

        if (!track) {
            return;
        }

        track.enabled = !track.enabled;

        updateMediaButtons();
    }


    async function flipCamera() {

        if (!window.matchMedia("(max-width: 850px)").matches) {
            return;
        }

        if (!localStream) {
            return;
        }

        const oldVideoTrack =
            localStream.getVideoTracks()[0];

        if (!oldVideoTrack) {
            return;
        }

        const newFacingMode =
            currentFacingMode === "user"
                ? "environment"
                : "user";

        try {

            const newStream =
                await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: newFacingMode
                    },
                    audio: false
                });

            const newVideoTrack =
                newStream.getVideoTracks()[0];

            if (!newVideoTrack) {
                return;
            }

            newVideoTrack.enabled =
                oldVideoTrack.enabled;


            if (peerConnection) {

                const sender =
                    peerConnection
                        .getSenders()
                        .find(
                            s =>
                                s.track &&
                                s.track.kind === "video"
                        );

                if (sender) {

                    await sender.replaceTrack(
                        newVideoTrack
                    );
                }
            }


            localStream.removeTrack(
                oldVideoTrack
            );

            localStream.addTrack(
                newVideoTrack
            );

            oldVideoTrack.stop();

            localVideo.srcObject =
                localStream;

            currentFacingMode =
                newFacingMode;

            updateMediaButtons();

        } catch (error) {

            console.error(
                "Flip camera error:",
                error
            );

            alert(
                "Hindi available ang camera na ito sa device mo."
            );
        }
    }


    async function toggleLoop() {

        if (connected) {

            closePeerConnection();

            remoteVideo.srcObject = null;

            connected = false;

            searching = true;

            searchOverlay.style.display = "flex";

            searchText.textContent =
                "Finding someone...";

            remoteStatus.textContent =
                "Searching...";

            socket.emit("skip");

            return;
        }

        if (searching) {
            return;
        }

        const mediaReady =
            await startMedia();

        if (!mediaReady) {
            return;
        }

        searching = true;

        loopBtn.disabled = true;
        stopBtn.disabled = false;

        searchOverlay.style.display =
            "flex";

        searchText.textContent =
            "Finding someone...";

        remoteStatus.textContent =
            "Searching...";

        socket.emit("skip");
    }


    function stopSession() {

        searching = false;
        connected = false;

        socket.emit("stop-search");

        closePeerConnection();

        remoteVideo.srcObject = null;

        searchOverlay.style.display =
            "none";

        remoteStatus.textContent =
            "Stopped";

        loopBtn.disabled = false;
        stopBtn.disabled = true;

        loopBtn.textContent =
            "🔄 Start Loop";
    }


    function createPeer(initiator) {

        closePeerConnection();

        pendingIceCandidates = [];

        peerConnection =
            new RTCPeerConnection(
                rtcConfig
            );


        if (localStream) {

            localStream
                .getTracks()
                .forEach(track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );
                });
        }


        peerConnection.ontrack =
            event => {

                if (
                    event.streams &&
                    event.streams[0]
                ) {

                    remoteVideo.srcObject =
                        event.streams[0];

                    remoteStatus.textContent =
                        "Connected";
                }
            };


        peerConnection.onicecandidate =
            event => {

                if (event.candidate) {

                    socket.emit(
                        "signal",
                        {
                            type: "candidate",
                            candidate: event.candidate
                        }
                    );
                }
            };


        peerConnection.onconnectionstatechange =
            () => {

                if (!peerConnection) {
                    return;
                }

                const state =
                    peerConnection.connectionState;

                console.log(
                    "Connection state:",
                    state
                );


                if (state === "connected") {

                    connected = true;
                    searching = false;

                    searchOverlay.style.display =
                        "none";

                    remoteStatus.textContent =
                        "Connected";

                    loopBtn.disabled = false;

                    loopBtn.textContent =
                        "⏭️ Next";
                }


                if (
                    state === "failed" ||
                    state === "disconnected"
                ) {

                    connected = false;

                    remoteStatus.textContent =
                        "Disconnected";

                    loopBtn.disabled = false;

                    loopBtn.textContent =
                        "🔄 Start Loop";
                }
            };


        if (initiator) {

            dataChannel =
                peerConnection.createDataChannel(
                    "chat"
                );

            setupDataChannel(
                dataChannel
            );

            createOffer();
        }


        peerConnection.ondatachannel =
            event => {

                dataChannel =
                    event.channel;

                setupDataChannel(
                    dataChannel
                );
            };
    }


    async function createOffer() {

        if (!peerConnection) {
            return;
        }

        try {

            const offer =
                await peerConnection.createOffer();

            await peerConnection.setLocalDescription(
                offer
            );

            socket.emit(
                "signal",
                {
                    type: "offer",
                    offer: offer
                }
            );

        } catch (error) {

            console.error(
                "Offer error:",
                error
            );
        }
    }


    async function handleOffer(offer) {

        if (!peerConnection) {
            createPeer(false);
        }

        try {

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );

            await flushIceCandidates();

            const answer =
                await peerConnection.createAnswer();

            await peerConnection.setLocalDescription(
                answer
            );

            socket.emit(
                "signal",
                {
                    type: "answer",
                    answer: answer
                }
            );

        } catch (error) {

            console.error(
                "Offer handling error:",
                error
            );
        }
    }


    async function handleAnswer(answer) {

        if (!peerConnection) {
            return;
        }

        try {

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );

            await flushIceCandidates();

        } catch (error) {

            console.error(
                "Answer error:",
                error
            );
        }
    }


    async function handleCandidate(candidate) {

        if (!peerConnection) {
            return;
        }

        try {

            if (
                peerConnection.remoteDescription &&
                peerConnection.remoteDescription.type
            ) {

                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } else {

                pendingIceCandidates.push(
                    candidate
                );
            }

        } catch (error) {

            console.error(
                "ICE candidate error:",
                error
            );
        }
    }


    async function flushIceCandidates() {

        if (!peerConnection) {
            return;
        }

        const candidates =
            pendingIceCandidates;

        pendingIceCandidates = [];

        for (
            const candidate
            of candidates
        ) {

            try {

                await peerConnection.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } catch (error) {

                console.error(
                    "ICE flush error:",
                    error
                );
            }
        }
    }


    function closePeerConnection() {

        pendingIceCandidates = [];

        if (dataChannel) {

            try {
                dataChannel.close();
            } catch (error) {}
        }

        dataChannel = null;


        if (peerConnection) {

            try {
                peerConnection.close();
            } catch (error) {}
        }

        peerConnection = null;
    }


    socket.on(
        "online-count",
        count => {

            onlineCount.textContent =
                count;
        }
    );


    socket.on(
        "waiting",
        () => {

            searching = true;

            searchOverlay.style.display =
                "flex";

            searchText.textContent =
                "Waiting for someone...";

            remoteStatus.textContent =
                "Waiting...";
        }
    );


    socket.on(
        "match",
        data => {

            searching = false;
            connected = false;

            searchOverlay.style.display =
                "none";

            remoteStatus.textContent =
                "Connecting...";

            stopBtn.disabled = false;

            createPeer(
                data.initiator
            );
        }
    );


    socket.on(
        "signal",
        async data => {

            if (data.type === "offer") {

                await handleOffer(
                    data.offer
                );

            } else if (
                data.type === "answer"
            ) {

                await handleAnswer(
                    data.answer
                );

            } else if (
                data.type === "candidate"
            ) {

                await handleCandidate(
                    data.candidate
                );
            }
        }
    );


    socket.on(
        "partner-disconnected",
        () => {

            connected = false;
            searching = false;

            closePeerConnection();

            remoteVideo.srcObject = null;

            remoteStatus.textContent =
                "Stranger left";

            searchOverlay.style.display =
                "none";

            loopBtn.disabled = false;
            stopBtn.disabled = true;

            loopBtn.textContent =
                "🔄 Start Loop";
        }
    );


    function setupDataChannel(channel) {

        channel.onopen =
            () => {

                console.log(
                    "Chat connected"
                );
            };


        channel.onmessage =
            event => {

                addMessage(
                    "Stranger",
                    event.data
                );
            };
    }


    function sendMessage() {

        const text =
            chatInput.value.trim();

        if (!text) {
            return;
        }

        if (
            !dataChannel ||
            dataChannel.readyState !== "open"
        ) {

            addMessage(
                "System",
                "Connect to a stranger first."
            );

            return;
        }

        dataChannel.send(text);

        addMessage(
            "Me",
            text
        );

        chatInput.value = "";
    }


    function addMessage(name, text) {

        const message =
            document.createElement("div");

        message.className =
            "message";

        const nameDiv =
            document.createElement("div");

        nameDiv.className =
            "message-name";

        nameDiv.textContent =
            name;

        const textDiv =
            document.createElement("div");

        textDiv.className =
            "message-text";

        textDiv.textContent =
            text;

        message.appendChild(nameDiv);
        message.appendChild(textDiv);

        chatMessages.appendChild(message);

        chatMessages.scrollTop =
            chatMessages.scrollHeight;
    }


    chatInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                sendMessage();
            }
        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (event.key === "Escape") {
                stopSession();
            }
        }
    );


    document
        .getElementById("languageSelect")
        .addEventListener(
            "change",
            event => {

                const lang =
                    event.target.value;

                if (lang === "tl") {

                    loopBtn.textContent =
                        connected
                            ? "⏭️ Next"
                            : "🔄 Start Loop";

                    stopBtn.textContent =
                        "⏹️ Stop";

                    chatInput.placeholder =
                        "Mag-type ng message...";

                } else {

                    loopBtn.textContent =
                        connected
                            ? "⏭️ Next"
                            : "🔄 Start Loop";

                    stopBtn.textContent =
                        "⏹️ Stop";

                    chatInput.placeholder =
                        "Type a message...";
                }
            }
        );
</script>

</body>
</html>
