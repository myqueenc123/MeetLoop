<title>MeetLoop - Random Video Chat</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg: #0b1120;
        --panel: #111827;
        --panel-light: #1f2937;
        --border: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.15);
        --blue: #2563eb;
        --blue2: #3b82f6;
        --red: #ef4444;
        --purple: #8b5cf6;
        --text: #f8fafc;
        --muted: #94a3b8;
    }

    html,
    body {
        width: 100%;
        height: 100%;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
            radial-gradient(
                circle at top left,
                rgba(37, 99, 235, 0.14),
                transparent 28%
            ),
            radial-gradient(
                circle at bottom right,
                rgba(139, 92, 246, 0.12),
                transparent 25%
            ),
            var(--bg);

        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
    }

    header {
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 20px;

        background: rgba(17, 24, 39, 0.92);
        border-bottom: 1px solid var(--border);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        position: relative;
        z-index: 20;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 8px;

        font-size: 22px;
        font-weight: 800;
        white-space: nowrap;
    }

    .brand-icon {
        width: 34px;
        height: 34px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;

        background:
            linear-gradient(
                135deg,
                var(--blue),
                var(--purple)
            );

        box-shadow:
            0 6px 20px rgba(37, 99, 235, 0.25);
    }

    .header-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        min-width: 0;
    }

    .badge {
        min-height: 34px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 7px 11px;

        border-radius: 999px;

        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--border);

        font-size: 12px;
        font-weight: 700;

        white-space: nowrap;
    }

    .online {
        color: #86efac;
    }

    #statusBadge {
        color: #cbd5e1;
    }

    select {
        min-height: 34px;
        padding: 7px 10px;

        color: white;
        background: rgba(255, 255, 255, 0.055);

        border: 1px solid var(--border);
        border-radius: 9px;

        outline: none;
        cursor: pointer;
    }

    #callTimer {
        gap: 7px;

        transition:
            color 0.25s ease,
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease;
    }

    .timer-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;
        background: #64748b;

        flex: 0 0 auto;
    }

    .timer-label {
        color: #94a3b8;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.8px;
    }

    .timer-time {
        min-width: 58px;

        font-size: 12px;
        font-weight: 900;

        font-variant-numeric: tabular-nums;
        letter-spacing: 0.6px;
    }

    #callTimer.active {
        color: #fecaca;

        background:
            linear-gradient(
                135deg,
                rgba(239, 68, 68, 0.16),
                rgba(239, 68, 68, 0.06)
            );

        border-color:
            rgba(239, 68, 68, 0.25);

        box-shadow:
            0 8px 25px rgba(239, 68, 68, 0.08);
    }

    #callTimer.active .timer-dot {
        background: var(--red);
        animation: timerPulse 1.5s infinite;
    }

    @keyframes timerPulse {
        0% {
            box-shadow:
                0 0 0 0
                rgba(239, 68, 68, 0.55);
        }

        70% {
            box-shadow:
                0 0 0 7px
                rgba(239, 68, 68, 0);
        }

        100% {
            box-shadow:
                0 0 0 0
                rgba(239, 68, 68, 0);
        }
    }

    .main-container {
        width: 100%;
        height: calc(100vh - 68px);

        display: flex;

        gap: 12px;
        padding: 12px;
    }

    .video-wrapper {
        flex: 1;
        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .videos-grid {
        flex: 1;
        min-height: 0;

        display: flex;
        gap: 10px;
    }

    .video-box {
        position: relative;

        flex: 1;
        min-width: 0;
        min-height: 0;

        overflow: hidden;

        background: #000;

        border: 1px solid var(--border);
        border-radius: 16px;

        box-shadow:
            0 10px 35px rgba(0, 0, 0, 0.25);
    }

    video {
        display: block;

        width: 100%;
        height: 100%;

        object-fit: cover;

        background: #000;

        border: 0;
        outline: 0;
    }

    #localVideo {
        transform: none;
    }

    .video-label {
        position: absolute;

        left: 10px;
        top: 10px;

        z-index: 4;

        padding: 6px 10px;

        background: rgba(0, 0, 0, 0.56);

        border:
            1px solid
            rgba(255, 255, 255, 0.08);

        border-radius: 9px;

        font-size: 12px;
        font-weight: 700;

        pointer-events: none;
    }

    .status {
        position: absolute;

        left: 10px;
        bottom: 10px;

        z-index: 4;

        padding: 6px 10px;

        background: rgba(0, 0, 0, 0.56);

        border:
            1px solid
            rgba(255, 255, 255, 0.08);

        border-radius: 9px;

        color: #e2e8f0;

        font-size: 11px;
        font-weight: 600;

        pointer-events: none;
    }

    .search-overlay {
        position: absolute;
        inset: 0;

        z-index: 10;

        display: none;

        align-items: center;
        justify-content: center;

        background:
            rgba(2, 6, 23, 0.72);

        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
    }

    .search-box {
        min-width: 220px;

        padding: 20px;

        text-align: center;

        background:
            rgba(15, 23, 42, 0.82);

        border:
            1px solid
            rgba(255, 255, 255, 0.08);

        border-radius: 16px;
    }

    .spinner {
        width: 42px;
        height: 42px;

        margin: 0 auto 12px;

        border: 4px solid
            rgba(255, 255, 255, 0.12);

        border-top-color: white;

        border-radius: 50%;

        animation:
            spin 0.8s linear infinite;
    }

    #searchText {
        color: #e2e8f0;

        font-size: 13px;
        font-weight: 700;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .controls-bar {
        display: flex;
        gap: 8px;

        padding: 2px;
    }

    .btn {
        min-height: 46px;

        padding: 11px 15px;

        border:
            1px solid
            rgba(255, 255, 255, 0.04);

        border-radius: 11px;

        color: white;
        background: var(--panel);

        cursor: pointer;

        font-size: 13px;
        font-weight: 800;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 6px;

        user-select: none;

        transition:
            transform 0.12s ease,
            filter 0.2s ease,
            opacity 0.2s ease;
    }

    .btn:hover:not(:disabled) {
        filter: brightness(1.08);
    }

    .btn:active:not(:disabled) {
        transform: scale(0.98);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-loop {
        flex: 1.5;

        background:
            linear-gradient(
                135deg,
                var(--blue),
                var(--blue2)
            );

        box-shadow:
            0 7px 22px
            rgba(37, 99, 235, 0.18);
    }

    .btn-stop {
        flex: 1;

        background:
            linear-gradient(
                135deg,
                #dc2626,
                #ef4444
            );
    }

    .btn-toggle {
        flex: 1;

        background:
            rgba(255, 255, 255, 0.07);
    }

    .btn-flip {
        display: none;

        flex: 1;

        background:
            linear-gradient(
                135deg,
                #7c3aed,
                #8b5cf6
            );
    }

    .chat-wrapper {
        width: 320px;
        max-width: 320px;
        min-height: 0;

        display: flex;
        flex-direction: column;

        overflow: hidden;

        background:
            rgba(17, 24, 39, 0.9);

        border:
            1px solid var(--border);

        border-radius: 16px;

        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
    }

    .chat-header {
        padding: 14px;

        border-bottom:
            1px solid var(--border);

        font-size: 13px;
        font-weight: 800;
    }

    .chat-messages {
        flex: 1;
        min-height: 0;

        overflow-y: auto;

        overscroll-behavior: contain;
    }

    .message {
        margin-bottom: 10px;

    }

    .message-name {
        margin-bottom: 3px;

        color: var(--muted);

        font-size: 10px;
        font-weight: 700;
    }

    .message-text {
        display: inline-block;

        max-width: 90%;

        padding: 8px 10px;

        color: #f8fafc;

        background:
            rgba(255, 255, 255, 0.075);

        border-radius: 10px;

        font-size: 12px;

        white-space: pre-wrap;
    }

    .chat-input-area {
        display: flex;
        gap: 6px;

    }

    #chatInput {
        flex: 1;

    #chatInput:focus {

    #sendBtn {

    ],

};


let localStream = null;
let peerConnection = null;
let dataChannel = null;

let pendingIceCandidates = [];

let remoteDescriptionSet = false;

let searching = false;
let connected = false;
let stopping = false;

let currentFacingMode = "user";

let connectionTimer = null;

let callTimerInterval = null;
let callStartTime = null;

let signalQueue =
    Promise.resolve();

let iceRestartAttempted = false;


function setStatus(text) {
    statusBadge.textContent =
        text;
}


function setRemoteStatus(text) {
    remoteStatus.textContent =

}


function showSearch(text) {
    searchText.textContent =

    searchOverlay.style.display =

}

    searchOverlay.style.display =

        .matchMedia(

        )
        .matches;
}


function clearConnectionTimer() {

    if (connectionTimer) {

        clearTimeout(
            connectionTimer
        );

        connectionTimer =
            null;
    }
}


function startConnectionTimer() {

    clearConnectionTimer();


    connectionTimer =
        setTimeout(
            () => {

                if (
                    peerConnection &&
                    !connected
                ) {

                    setRemoteStatus(
                        "Connection failed"
                    );

                    setStatus(
                        "Connection failed"
                    );

                    loopBtn.disabled =
                        false;

                    loopBtn.textContent =
                        "🔄 Start Loop";
                }

            },
            20000
        );
}


function queueSignal(callback) {

    signalQueue =
        signalQueue
            .then(callback)
            .catch(
                error => {

                    console.error(
                        "Signal queue error:",
                        error
                    );
                }
            );

    return signalQueue;
}


/* =========================
   CALL TIMER
========================= */

function formatCallTime(
    totalSeconds
) {

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;


    return (
        String(hours).padStart(
            2,
            "0"
        ) +
        ":" +
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        )
    );
}


function updateCallTimer() {

    if (!callStartTime) {

        callTimerValue.textContent =
            "00:00:00";

        return;
    }


    const elapsed =
        Math.floor(
            (
                Date.now() -
                callStartTime
            ) / 1000
        );


    callTimerValue.textContent =
        formatCallTime(
            Math.max(
                0,
                elapsed
            )
        );
}


function startCallTimer() {

    stopCallTimer();


    callStartTime =
        Date.now();


    callTimer.classList.add(
        "active"
    );


    updateCallTimer();


    callTimerInterval =
        setInterval(
            updateCallTimer,
            1000
        );
}


function stopCallTimer() {

    if (callTimerInterval) {

        clearInterval(
            callTimerInterval
        );

        callTimerInterval =
            null;
    }


    callStartTime =
        null;


    callTimer.classList.remove(
        "active"
    );


    callTimerValue.textContent =
        "00:00:00";
}


/* =========================
   MEDIA
========================= */

async function startMedia() {

    if (localStream) {
        return true;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Camera and microphone are not supported by this browser."
        );

        return false;
    }


    try {

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal:
                                "user"
                        },

                        width: {
                            ideal: 1280,
                            max: 1920
                        },

                        height: {
                            ideal: 720,
                            max: 1080
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }
                    },

                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });


        localVideo.srcObject =
            localStream;


        localVideo.muted =
            true;

        localVideo.autoplay =
            true;

        localVideo.playsInline =
            true;


        await localVideo
            .play()
            .catch(
                () => {}
            );


        currentFacingMode =
            "user";


        updateMediaButtons();


        return true;

    } catch (error) {

        console.error(
            "GET USER MEDIA ERROR:",
            error
        );


        localStream =
            null;


        alert(
            "Hindi ma-access ang camera/microphone. I-check ang Chrome permissions."
        );


        return false;
    }
}


function updateMediaButtons() {

    if (!localStream) {
        return;
    }


    const audioTrack =
        localStream
            .getAudioTracks()[0];

    const videoTrack =
        localStream
            .getVideoTracks()[0];


    if (audioTrack) {

        micBtn.textContent =
            audioTrack.enabled
                ? "🎙️ Mic On"
                : "🔇 Mic Off";
    }


    if (videoTrack) {

        camBtn.textContent =
            videoTrack.enabled
                ? "📷 Cam On"
                : "🚫 Cam Off";
    }
}


function toggleMic() {

    if (!localStream) {
        return;
    }


    const track =
        localStream
            .getAudioTracks()[0];


    if (!track) {
        return;
    }


    track.enabled =
        !track.enabled;


    updateMediaButtons();
}


function toggleCam() {

    if (!localStream) {
        return;
    }


    const track =
        localStream
            .getVideoTracks()[0];


    if (!track) {
        return;
    }


    track.enabled =
        !track.enabled;


    updateMediaButtons();
}


/* =========================
   CAMERA FLIP
========================= */

async function flipCamera() {

    if (!isMobile()) {
        return;
    }


    if (!localStream) {
        return;
    }


    const oldTrack =
        localStream
            .getVideoTracks()[0];


    if (!oldTrack) {
        return;
    }


    const nextFacingMode =
        currentFacingMode ===
            "user"
            ? "environment"
            : "user";


    let newStream =
        null;


    try {

        newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal:
                                nextFacingMode
                        }
                    },

                    audio: false
                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        if (!newTrack) {

            throw new Error(
                "No replacement camera"
            );
        }


        newTrack.enabled =
            oldTrack.enabled;


        if (peerConnection) {

            const sender =
                peerConnection
                    .getSenders()
                    .find(
                        item =>
                            item.track &&
                            item.track.kind ===
                                "video"
                    );


            if (sender) {

                await sender.replaceTrack(
                    newTrack
                );
            }
        }


        localStream.removeTrack(
            oldTrack
        );

        localStream.addTrack(
            newTrack
        );


        oldTrack.stop();


        localVideo.srcObject =
            localStream;


        await localVideo
            .play()
            .catch(
                () => {}
            );


        currentFacingMode =
            nextFacingMode;


        updateMediaButtons();

    } catch (error) {

        console.error(
            "FLIP CAMERA ERROR:",
            error
        );


        if (newStream) {

            newStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        alert(
            "Hindi ma-switch ang camera."
        );
    }
}


/* =========================
   PEER
========================= */

function createPeer(
    initiator
) {

    closePeerConnection();


    pendingIceCandidates =
        [];

    remoteDescriptionSet =
        false;

    iceRestartAttempted =
        false;


    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );
                }
            );
    }


    peerConnection.ontrack =
        event => {

            console.log(
                "REMOTE TRACK:",
                event.track.kind
            );


            let stream =
                remoteVideo.srcObject;


            if (
                event.streams &&
                event.streams[0]
            ) {

                stream =
                    event.streams[0];

            } else if (!stream) {

                stream =
                    new MediaStream();
            }


            if (
                !stream
                    .getTracks()
                    .includes(
                        event.track
                    )
            ) {

                stream.addTrack(
                    event.track
                );
            }


            remoteVideo.srcObject =
                stream;


            remoteVideo.autoplay =
                true;

            remoteVideo.playsInline =
                true;


            remoteVideo
                .play()
                .catch(
                    error => {

                        console.warn(
                            "REMOTE PLAY ERROR:",
                            error
                        );
                    }
                );


            if (
                event.track.kind ===
                "video"
            ) {

                setRemoteStatus(
                    "Video connected"
                );
            }
        };


    peerConnection.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                socket.emit(
                    "signal",
                    {
                        type:
                            "candidate",

                        candidate:
                            event.candidate
                    }
                );
            }
        };


    peerConnection
        .oniceconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection
                    .iceConnectionState;


            console.log(
                "ICE STATE:",
                state
            );


            if (
                state === "checking"
            ) {

                setStatus(
                    "Connecting..."
                );
            }


            if (
                state === "connected" ||
                state === "completed"
            ) {

                setStatus(
                    "Connected"
                );
            }


            if (
                state === "failed" &&
                !iceRestartAttempted &&
                initiator
            ) {

                iceRestartAttempted =
                    true;


                try {

                    peerConnection
                        .restartIce();


                    createOffer(
                        true
                    );

                } catch (error) {

                    console.error(
                        "ICE restart error:",
                        error
                    );
                }
            }
        };


    peerConnection
        .onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection
                    .connectionState;


            console.log(
                "CONNECTION STATE:",
                state
            );


            if (
                state ===
                "connecting"
            ) {

                setRemoteStatus(
                    "Connecting..."
                );

                setStatus(
                    "Connecting..."
                );
            }


            if (
                state ===
                "connected"
            ) {

                connected =
                    true;

                searching =
                    false;


                clearConnectionTimer();


                hideSearch();


                setRemoteStatus(
                    "Connected"
                );

                setStatus(
                    "Connected"
                );


                loopBtn.disabled =
                    false;

                stopBtn.disabled =
                    false;


                loopBtn.textContent =
                    "⏭️ Next";


                if (
                    !callStartTime
                ) {

                    startCallTimer();
                }
            }


            if (
                state ===
                "failed"
            ) {

                connected =
                    false;

                searching =
                    false;


                stopCallTimer();


                setRemoteStatus(
                    "Connection failed"
                );

                setStatus(
                    "Connection failed"
                );


                loopBtn.disabled =
                    false;

                loopBtn.textContent =
                    "🔄 Start Loop";
            }


            if (
                state ===
                "disconnected"
            ) {

                setRemoteStatus(
                    "Disconnected"
                );
            }
        };


    peerConnection
        .onicegatheringstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            console.log(
                "ICE GATHERING:",
                peerConnection
                    .iceGatheringState
            );
        };


    peerConnection
        .onsignalingstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            console.log(
                "SIGNALING:",
                peerConnection
                    .signalingState
            );
        };


    peerConnection.ondatachannel =
        event => {

            console.log(
                "REMOTE DATA CHANNEL"
            );


            dataChannel =
                event.channel;


            setupDataChannel(
                dataChannel
            );
        };


    if (initiator) {

        dataChannel =
            peerConnection
                .createDataChannel(
                    "chat",
                    {
                        ordered:
                            true
                    }
                );


        setupDataChannel(
            dataChannel
        );


        createOffer();
    }


    startConnectionTimer();
}


/* =========================
   OFFER
========================= */

async function createOffer(
    iceRestart = false
) {

    if (!peerConnection) {
        return;
    }


    try {

        const offer =
            await peerConnection
                .createOffer(
                    iceRestart
                        ? {
                            iceRestart:
                                true
                        }
                        : undefined
                );


        await peerConnection
            .setLocalDescription(
                offer
            );


        socket.emit(
            "signal",
            {
                type:
                    "offer",

                offer:
                    peerConnection
                        .localDescription
            }
        );

    } catch (error) {

        console.error(
            "CREATE OFFER ERROR:",
            error
        );
    }
}


/* =========================
   OFFER HANDLER
========================= */

async function handleOffer(
    offer
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {

                createPeer(
                    false
                );
            }


            if (!peerConnection) {
                return;
            }


            try {

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            offer
                        )
                    );


                remoteDescriptionSet =
                    true;


                await flushIceCandidates();


                const answer =
                    await peerConnection
                        .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                socket.emit(
                    "signal",
                    {
                        type:
                            "answer",

                        answer:
                            peerConnection
                                .localDescription
                    }
                );

            } catch (error) {

                console.error(
                    "HANDLE OFFER ERROR:",
                    error
                );
            }
        }
    );
}


/* =========================
   ANSWER HANDLER
========================= */

async function handleAnswer(
    answer
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {
                return;
            }


            try {

                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            answer
                        )
                    );


                remoteDescriptionSet =
                    true;


                await flushIceCandidates();

            } catch (error) {

                console.error(
                    "HANDLE ANSWER ERROR:",
                    error
                );
            }
        }
    );
}


/* =========================
   ICE
========================= */

async function handleCandidate(
    candidate
) {

    await queueSignal(
        async () => {

            if (!peerConnection) {
                return;
            }


            try {

                if (
                    remoteDescriptionSet &&
                    peerConnection
                        .remoteDescription
                ) {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                } else {

                    pendingIceCandidates
                        .push(
                            candidate
                        );
                }

            } catch (error) {

                console.error(
                    "ADD ICE ERROR:",
                    error
                );
            }
        }
    );
}


async function flushIceCandidates() {

    if (!peerConnection) {
        return;
    }


    const candidates =
        pendingIceCandidates;


    pendingIceCandidates =
        [];


    for (
        const candidate
        of candidates
    ) {

        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                "FLUSH ICE ERROR:",
                error
            );
        }
    }
}


/* =========================
   CLOSE PEER
========================= */

function closePeerConnection() {

    clearConnectionTimer();


    pendingIceCandidates =
        [];

    remoteDescriptionSet =
        false;


    signalQueue =
        Promise.resolve();


    if (dataChannel) {

        try {
            dataChannel.close();
        } catch (error) {}

        dataChannel =
            null;
    }


    if (peerConnection) {

        try {

            peerConnection.ontrack =
                null;

            peerConnection.onicecandidate =
                null;

            peerConnection
                .onconnectionstatechange =
                null;

            peerConnection
                .oniceconnectionstatechange =
                null;

            peerConnection
                .ondatachannel =
                null;

            peerConnection.close();

        } catch (error) {}
    }


    peerConnection =
        null;
}


/* =========================
   START LOOP
========================= */

async function startLoop() {

    if (stopping) {
        return;
    }


    if (connected) {

        stopCallTimer();


        closePeerConnection();


        remoteVideo.srcObject =
            null;


        connected =
            false;

        searching =
            true;


        showSearch(
            "Finding someone..."
        );


        setRemoteStatus(
            "Searching..."
        );

        setStatus(
            "Searching..."
        );


        loopBtn.disabled =
            true;


        socket.emit(
            "skip"
        );


        return;
    }


    if (searching) {
        return;
    }


    const mediaReady =
        await startMedia();


    if (!mediaReady) {
        return;
    }


    searching =
        true;

    connected =
        false;


    loopBtn.disabled =
        true;

    stopBtn.disabled =
        false;


    showSearch(
        "Finding someone..."
    );


    setRemoteStatus(
        "Searching..."
    );

    setStatus(
        "Searching..."
    );


    socket.emit(
        "skip"
    );
}


/* =========================
   STOP
========================= */

function stopSession() {

    stopping =
        true;


    searching =
        false;

    connected =
        false;


    stopCallTimer();


    socket.emit(
        "stop-search"
    );


    closePeerConnection();


    remoteVideo.srcObject =
        null;


    hideSearch();


    setRemoteStatus(
        "Stopped"
    );

    setStatus(
        "Ready"
    );


    loopBtn.disabled =
        false;

    stopBtn.disabled =
        true;


    loopBtn.textContent =
        "🔄 Start Loop";


    setTimeout(
        () => {
            stopping =
                false;
        },
        150
    );
}


/* =========================
   SOCKET EVENTS
========================= */

socket.on(
    "connect",
    () => {

        console.log(
            "SOCKET CONNECTED:",
            socket.id
        );


        setStatus(
            connected
                ? "Connected"
                : "Ready"
        );
    }
);


socket.on(
    "connect_error",
    error => {

        console.error(
            "SOCKET ERROR:",
            error
        );


        setStatus(
            "Server reconnecting..."
        );
    }
);


socket.on(
    "online-count",
    count => {

        onlineCount.textContent =
            String(count);
    }
);


socket.on(
    "waiting",
    () => {

        searching =
            true;


        showSearch(
            "Waiting for someone..."
        );


        setRemoteStatus(
            "Waiting..."
        );

        setStatus(
            "Waiting..."
        );
    }
);


socket.on(
    "match",
    data => {

        searching =
            false;

        connected =
            false;


        hideSearch();


        setRemoteStatus(
            "Connecting..."
        );

        setStatus(
            "Connecting..."
        );


        stopBtn.disabled =
            false;


        createPeer(
            Boolean(
                data &&
                data.initiator
            )
        );
    }
);


socket.on(
    "signal",
    data => {

        if (
            !data ||
            !data.type
        ) {
            return;
        }


        if (
            data.type ===
            "offer"
        ) {

            handleOffer(
                data.offer
            );

        } else if (
            data.type ===
            "answer"
        ) {

            handleAnswer(
                data.answer
            );

        } else if (
            data.type ===
            "candidate"
        ) {

            handleCandidate(
                data.candidate
            );
        }
    }
);


socket.on(
    "partner-disconnected",
    () => {

        connected =
            false;

        searching =
            false;


        stopCallTimer();


        closePeerConnection();


        remoteVideo.srcObject =
            null;


        hideSearch();


        setRemoteStatus(
            "Stranger left"
        );

        setStatus(
            "Ready"
        );


        loopBtn.disabled =
            false;

        stopBtn.disabled =
            true;


        loopBtn.textContent =
            "🔄 Start Loop";
    }
);


socket.on(
    "disconnect",
    reason => {

        console.warn(
            "SOCKET DISCONNECTED:",
            reason
        );


        if (!connected) {

            setStatus(
                "Reconnecting..."
            );
        }
    }
);


/* =========================
   CHAT
========================= */

function setupDataChannel(
    channel
) {

    if (!channel) {
        return;
    }


    channel.onopen =
        () => {

            console.log(
                "CHAT CONNECTED"
            );
        };


    channel.onclose =
        () => {

            console.log(
                "CHAT CLOSED"
            );
        };


    channel.onerror =
        error => {

            console.error(
                "CHAT ERROR:",
                error
            );
        };


    channel.onmessage =
        event => {

            addMessage(
                "Stranger",
                String(
                    event.data
                )
            );
        };
}


function sendMessage() {

    const text =
        chatInput.value.trim();


    if (!text) {
        return;
    }


    if (
        !dataChannel ||
        dataChannel.readyState !==
            "open"
    ) {

        addMessage(
            "System",
            "Connect to a stranger first."
        );

        return;
    }


    try {

        dataChannel.send(
            text
        );


        addMessage(
            "Me",
            text
        );


        chatInput.value =
            "";

    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );
    }
}


function addMessage(
    name,
    text
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message";


    const nameDiv =
        document.createElement(
            "div"
        );


    nameDiv.className =
        "message-name";

    nameDiv.textContent =
        name;


    const textDiv =
        document.createElement(
            "div"
        );


    textDiv.className =
        "message-text";

    textDiv.textContent =
        text;


    message.appendChild(
        nameDiv
    );

    message.appendChild(
        textDiv
    );


    chatMessages.appendChild(
        message
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


/* =========================
   EVENTS
========================= */

loopBtn.addEventListener(
    "click",
    startLoop
);


stopBtn.addEventListener(
    "click",
    stopSession
);


micBtn.addEventListener(
    "click",
    toggleMic
);


camBtn.addEventListener(
    "click",
    toggleCam
);


flipBtn.addEventListener(
    "click",
    flipCamera
);


sendBtn.addEventListener(
    "click",
    sendMessage
);


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================
   LANGUAGE
========================= */

languageSelect.addEventListener(
    "change",
    event => {

        const lang =
            event.target.value;


        chatInput.placeholder =
            lang === "tl"
                ? "Mag-type ng message..."
                : "Type a message...";


        loopBtn.textContent =
            connected
                ? "⏭️ Next"
                : "🔄 Start Loop";
    }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                localStream &&
                localVideo.srcObject
            ) {

                localVideo
                    .play()
                    .catch(
                        () => {}
                    );
            }


            if (
                remoteVideo.srcObject &&
                connected
            ) {

                remoteVideo
                    .play()
                    .catch(
                        () => {}
                    );
            }
        }
    }
);


/* =========================
   CLEANUP
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            socket.emit(
                "stop-search"
            );

        } catch (error) {}


        stopCallTimer();


        if (localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }


        closePeerConnection();
    }
);


/* =========================
   INITIAL STATE
========================= */

stopCallTimer();

setStatus(
    "Ready"
);

setRemoteStatus(
    "Waiting..."
);

stopBtn.disabled =
    true;

</script>
