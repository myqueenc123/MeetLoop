<title>MeetLoop - Random Video Chat</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0e17'/%3E%3Cpath d='M38 22 C24 22 14 32 14 46 C14 53.5 17 60 22 65 L18 78 L32 73.5 C34.5 74.5 37 75 40 75 Z' fill='%2338bdf8'/%3E%3Cpath d='M62 25 C50 25 40 34.5 40 46.5 C40 51.5 42 56 45 59.5 C48 55 53 52 59 52 Z' fill='%23a855f7'/%3E%3C/svg%3E">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{
  --bg-dark:#0a0e17;
  --panel-dark:#111827;
  --panel-border:#1f293d;
  --blue:#0084ff;
  --green:#22c55e;
  --red:#ef4444;
  --text-main:#f9fafb;
  --text-muted:#9ca3af;
}

html,body{
  width:100%;height:100%;background:var(--bg-dark);color:var(--text-main);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* STRICT 1-TAB ONLY OVERLAY */
#duplicateTabOverlay{
  position:fixed;inset:0;z-index:2147483647;background:rgba(10, 14, 23, 0.98);
  display:none;align-items:center;justify-content:center;padding:16px;text-align:center;
}
.tab-lock-card{
  background:#111827;border:1.5px solid #ef4444;border-radius:20px;
  max-width:380px;width:100%;padding:26px 20px;box-shadow:0 25px 60px rgba(0,0,0,0.9);
}
.btn-claim-tab{
  width:100%;height:44px;border:0;border-radius:10px;background:#2563eb;
  color:#fff;font-size:13px;font-weight:800;cursor:pointer;margin-top:14px;
}

/* HEADER */
header{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:#0d131f;border-bottom:1px solid var(--panel-border);
  position:relative;z-index:20;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;user-select:none;cursor:pointer}
.brand-text{font-size:19px;font-weight:900;letter-spacing:-0.5px;color:#fff}
.brand-text span{color:#38bdf8}
.lang-select{
  background:#1e293b;color:#fff;border:1px solid rgba(255,255,255,.2);
  padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;outline:none;cursor:pointer;
}

/* STAGE */
.stage-container{
  width:100%;height:calc(100vh - 52px);
  display:flex;gap:10px;padding:10px;
}
.stream-arena{
  flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;
}
.video-grid{
  position:relative;flex:1;min-height:0;display:flex;gap:10px;
}
.cam-box{
  position:relative;flex:1;min-width:0;min-height:0;background:#000000;
  border-radius:14px;overflow:hidden;border:1px solid var(--panel-border);
}

video{
  width:100%;height:100%;object-fit:cover;background:#000000;display:block;
}

.crt-screen-wrapper{
  position:absolute;inset:0;z-index:2;overflow:hidden;background:#050811;pointer-events:none;
}
#crtStaticCanvas{
  position:absolute;inset:0;width:100%;height:100%;opacity:0.25;display:block;
}
.crt-overlay-vignette{
  position:absolute;inset:0;
  background:radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%),
             repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1.5px, transparent 1.5px, transparent 3px);
  pointer-events:none;
}

.standby-center{
  position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 12px;user-select:none;pointer-events:none;
}
.standby-logo{
  width:105px;height:105px;margin-bottom:12px;
  filter:drop-shadow(0 0 25px rgba(56,189,248,.6));
  animation:floatLogo 3s ease-in-out infinite alternate;
}
@keyframes floatLogo{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.standby-title{font-size:30px;font-weight:900;letter-spacing:-0.5px;color:#fff}
.standby-online-tag{
  background:rgba(15,23,42,0.88);border:1px solid rgba(255,255,255,.15);
  padding:6px 16px;border-radius:20px;font-size:13px;font-weight:800;color:#cbd5e1;
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.6);margin-top:8px;
}
.online-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);
}

/* CLEAN LOADING SPINNER */
.search-loader{
  position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;user-select:none;
}
.search-spinner{
  width:44px;height:44px;border:4px solid rgba(255,255,255,.15);
  border-top-color:#38bdf8;border-radius:50%;animation:spin .75s linear infinite;
  filter:drop-shadow(0 0 12px rgba(56,189,248,0.7));
}
@keyframes spin{to{transform:rotate(360deg)}}

#remoteVideo.remote-blur{filter:blur(25px) brightness(0.9)}
#remoteVideo.remote-clear{filter:blur(0px) brightness(1.0);transition:filter 0.25s ease-out}

.remote-audio-badge{
  position:absolute;bottom:10px;left:10px;z-index:5;
  background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:20px;display:flex;align-items:center;gap:6px;
}
.audio-speaker-btn{width:16px;height:16px;fill:#cbd5e1;cursor:pointer}
.audio-slider{width:60px;height:4px;-webkit-appearance:none;background:#334155;border-radius:999px;outline:none;cursor:pointer}
.audio-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#38bdf8;cursor:pointer}

#localVideo.mirrored{transform:scaleX(-1)}
#localVideo.unmirrored{transform:scaleX(1)}

.cam-tag{
  position:absolute;top:10px;left:10px;z-index:5;
  background:rgba(0,0,0,.7);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;color:#fff;
}
.cam-status-pill{
  position:absolute;top:10px;left:80px;z-index:5;
  background:rgba(0,0,0,.75);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;color:#cbd5e1;
}
#reportBtn{
  position:absolute;top:10px;right:10px;z-index:5;
  background:#dc2626;color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:800;cursor:pointer;
}

.controls-panel{display:flex;gap:8px;height:48px;flex-shrink:0}
.ctrl-btn{
  border:0;border-radius:10px;color:#fff;font-size:13px;font-weight:800;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none;
}
.btn-start-next{flex:3;background:linear-gradient(135deg,#0284c7,#2563eb)}
.btn-stop{flex:1.5;background:#dc2626}
.btn-sec{flex:1.5;background:#1e293b;border:1px solid rgba(255,255,255,.08)}
.btn-flip{background:#6b21a8}

.chat-arena{
  width:300px;max-width:300px;display:flex;flex-direction:column;
  background:var(--panel-dark);border:1px solid var(--panel-border);border-radius:14px;overflow:hidden;
}
.chat-head{padding:12px 14px;border-bottom:1px solid var(--panel-border);display:flex;align-items:center;justify-content:space-between}
.chat-stream{flex:1;min-height:0;padding:10px;overflow-y:auto}
.chat-msg{margin-bottom:10px;word-break:break-word}
.chat-author{font-size:9px;font-weight:800;color:var(--text-muted);margin-bottom:2px}
.chat-bubble{display:inline-block;max-width:96%;padding:8px 11px;background:#1e293b;border-radius:8px;font-size:11px;line-height:1.4;color:#f8fafc}
.chat-rules-card{background:#1e1b4b;border:1.5px solid #4338ca;font-size:11.5px;line-height:1.6;color:#e2e8f0;padding:12px;border-radius:10px}
.chat-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--panel-border)}
.chat-input{flex:1;min-width:0;height:38px;padding:0 12px;background:#070b14;border:1px solid var(--panel-border);border-radius:8px;color:#fff;outline:none;font-size:11px}
.chat-send-btn{width:60px;height:38px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:11px;font-weight:800;cursor:pointer}

@media (max-width:850px){
  body{height:100dvh;overflow-y:auto}
  header{height:46px;padding:0 10px}
  .stage-container{height:auto;min-height:calc(100dvh - 46px);flex-direction:column;gap:8px;padding:8px}
  .stream-arena{width:100%;flex:none;gap:8px}
  .video-grid{position:relative;width:100%;height:min(50dvh,420px);min-height:260px;display:block;border-radius:12px;overflow:hidden}
  .cam-box:first-child{position:absolute;inset:0;width:100%;height:100%}
  #localCamBox{position:absolute;right:8px;bottom:8px;width:28vw;max-width:110px;aspect-ratio:3/4;height:auto;z-index:8;border:2px solid #ffffff;border-radius:10px}
  #localCamBox.hidden-cam{display:none !important}
  #hideLocalBtn{position:absolute;top:3px;right:3px;z-index:9;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;border:0;font-size:10px;font-weight:bold;cursor:pointer;display:flex !important;align-items:center;justify-content:center}
  #showLocalBtn{position:absolute;right:8px;bottom:8px;z-index:30;display:none;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#1e293b;border:1px solid #38bdf8;color:#fff;font-size:10px;font-weight:800}
  #showLocalBtn.visible{display:flex !important}
  .controls-panel{height:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
  .ctrl-btn{min-height:42px;font-size:12px;padding:4px}
  .btn-start-next{grid-column:span 4}
  .btn-stop{grid-column:span 2}
  .btn-sec{grid-column:span 3}
  #flipBtn{grid-column:span 3;display:flex !important}
  .chat-arena{width:100%;max-width:none;height:240px;min-height:240px;border-radius:12px}
}
@media (min-width:851px){
  #hideLocalBtn, #showLocalBtn, #flipBtn{display:none !important}
}

/* HARD LOCK BAN OVERLAY */
#banOverlay{
  position:fixed !important;inset:0 !important;z-index:2147483647 !important;
  background:rgba(0,0,0,0.98) !important;display:none;align-items:center;justify-content:center;
  padding:12px;overflow-y:auto;
}
.ban-card{
  max-width:440px;width:100%;background:#ffffff;border-radius:22px;
  color:#1e293b;box-shadow:0 30px 70px rgba(0,0,0,1);overflow:hidden;
  max-height:94vh;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;
}
.ban-top{display:flex;gap:12px;align-items:center}
.ban-snap-frame{
  width:95px;height:95px;border-radius:12px;overflow:hidden;
  position:relative;background:#0f172a;border:2px solid #cbd5e1;flex-shrink:0;
}
#banCanvas{width:100%;height:100%;object-fit:cover;display:block}
.ban-snap-brand{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.75);padding:2px 5px;border-radius:4px;color:#fff;font-size:8px;font-weight:900}
.ban-snap-tag{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(220,38,38,0.88);color:#fff;font-size:7.5px;font-weight:900;text-align:center;padding:2px 0;border-radius:3px}
.ban-title{font-size:18px;font-weight:900;color:#dc2626}
.ban-reason{font-size:11.5px;color:#475569;font-weight:700}

.ban-disclaimer-box{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:14px;text-align:left;font-size:11.5px;line-height:1.5;color:#334155}
.ban-disclaimer-title{color:#dc2626;font-size:13px;font-weight:900;margin-bottom:6px}

.method-choice-container{display:flex;flex-direction:column;gap:9px}
.method-card{border:1.5px solid #e2e8f0;border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#f8fafc}
.method-card:hover{border-color:#005ce6;background:#f0f7ff}
.method-card-left{display:flex;align-items:center;gap:10px}
.method-icon-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.method-title{font-size:13px;font-weight:800;color:#0f172a}
.method-desc{font-size:10.5px;color:#64748b}

#gcashPaySection{display:none;flex-direction:column;gap:10px}
.gcash-logo-banner{background:#005ce6;border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:center}
.gcash-official-svg{height:30px;max-width:170px;display:block}
.gcash-qr-box{background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.gcash-qr-frame{background:#ffffff;padding:8px;border-radius:12px;border:1.5px solid #94a3b8;display:inline-block}
.gcash-qr-img{width:165px;height:165px;display:block;border-radius:4px;object-fit:contain}
.gcash-fee-tag{background:#0284c7;color:#fff;font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px}
.gcash-input-group{width:100%;display:flex;flex-direction:column;gap:6px}
.gcash-input-field{width:100%;height:40px;padding:0 12px;background:#ffffff;border:2px solid #bfdbfe;border-radius:10px;color:#0f172a;font-size:12.5px;font-weight:700;outline:none}
.gcash-verify-btn{width:100%;height:46px;border:0;border-radius:10px;background:#005ce6;color:#fff;font-size:13px;font-weight:900;cursor:pointer}
.gcash-verify-btn:disabled{background:#475569 !important;cursor:not-allowed !important}

.telegram-support-btn{
  width:100%;height:42px;border:1.5px solid #0284c7;border-radius:10px;background:#0f172a;color:#38bdf8;
  font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.btn-back-methods{background:none;border:0;color:#64748b;font-size:11.5px;font-weight:800;cursor:pointer;text-align:center}

.ban-expire-box{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.ban-expire-label{font-size:11px;font-weight:800;color:#dc2626}
.ban-expire-time{font-size:12px;font-weight:800;color:#0f172a}
.ban-id-chip"><span id="lblDeviceBanId">Device Ban ID:</span> <span id="adminUnbanId">--</span></div>
    </div>
  </div>
</div>

<!-- STAGE -->
<div class="stage-container">
  <div class="stream-arena">
    <div class="video-grid">
      <div class="cam-box" id="remoteBox">
        <video id="remoteVideo" class="remote-blur" autoplay playsinline webkit-playsinline></video>

        <div class="crt-screen-wrapper" id="crtWrapper">
          <canvas id="crtStaticCanvas"></canvas>
          <div class="crt-overlay-vignette"></div>
        </div>

        <div id="standbyCenter" class="standby-center">
          <svg style="width:105px;height:105px;margin-bottom:12px" viewBox="0 0 100 100">

<!-- REPORT MODAL -->
<div id="reportModal" style="position:fixed;inset:0;z-index:2147483640;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#111827;border:1.5px solid rgba(255,255,255,0.15);border-radius:20px;max-width:380px;width:100%;padding:20px;">

    <div style="font-size:11.5px;color:#94a3b8;margin-bottom:14px;">Select the violation reason:</div>
    <select id="reportReasonSelect" style="width:100%;height:42px;background:#0f172a;border:1.5px solid #334155;border-radius:10px;color:#f8fafc;font-size:12.5px;font-weight:700;padding:0 10px;outline:none;margin-bottom:16px;">
      <option value="Nudity / Sexual Content">🔞 Nudity / Sexual Content</option>
      <option value="Harassment / Bullying">🛑 Harassment / Bullying</option>
      <option value="Hate Speech">🗣️ Hate Speech</option>
      <option value="Threats / Violence">⚠️ Threats / Violence</option>
      <option value="Spam / Advertising">📢 Spam / Advertising</option>
      <option value="Scam / Fraud">💳 Scam / Fraud</option>
      <option value="Underage User">🚸 Underage User</option>
      <option value="Inappropriate Behavior">🚫 Inappropriate Behavior</option>
      <option value="Impersonation">🎭 Impersonation</option>
      <option value="Other">❓ Other</option>
    </select>

"use strict";

/* ================= 1. STRICT 1-TAB ONLY & PERSISTENT BAN ENGINE ================= */
const myTabId = "tab_" + Math.random().toString(36).substr(2, 9) + "_" + Date.now();

  let devId = localStorage.getItem("meetloop_device_id");
  if (!devId || forceNew) {
    devId = "dev_" + Math.random().toString(36).substring(2, 11) + "_" + Date.now();
    localStorage.setItem("meetloop_device_id", devId);
  }

}

if (savedBanUntil && Date.now() < savedBanUntil) {

} else {

  localStorage.removeItem("meetloop_ban_reason");
  localStorage.removeItem("meetloop_ban_snapshot");
}

try {
  tabChannel = new BroadcastChannel("meetloop_tab_lock");
  tabChannel.onmessage = (e) => {
    if (e.data && e.data.type === "CLAIM_MASTER") {
      if (e.data.tabId !== myTabId) {
        isMasterTab = false;
        showDuplicateTabBlocker();
      }
    } else if (e.data && e.data.type === "UNBAN_EVENT") {
      isCurrentlyBanned = false;
      localStorage.removeItem("meetloop_ban_until");
      localStorage.removeItem("meetloop_ban_reason");
      localStorage.removeItem("meetloop_ban_snapshot");
      document.getElementById("banOverlay").style.display = "none";
    }
  };
} catch(e){}

function checkMultiTabConflict() {
  const activeMaster = localStorage.getItem("meetloop_active_tab");
  const lastActiveTime = parseInt(localStorage.getItem("meetloop_tab_ping") || "0", 10);
  const now = Date.now();

  if (!activeMaster || activeMaster === myTabId || (now - lastActiveTime > 3000)) {
    claimActiveTab();
  } else {
    showDuplicateTabBlocker();
  }
}

function claimActiveTab() {
  isMasterTab = true;
  localStorage.setItem("meetloop_active_tab", myTabId);
  localStorage.setItem("meetloop_tab_ping", Date.now().toString());
  document.getElementById("duplicateTabOverlay").style.display = "none";
  if (tabChannel) tabChannel.postMessage({ type: "CLAIM_MASTER", tabId: myTabId });
}

function showDuplicateTabBlocker() {
  stopSession();
  document.getElementById("duplicateTabOverlay").style.display = "flex";
}

document.getElementById("btnClaimTab").addEventListener("click", () => {
  claimActiveTab();
});

setInterval(() => {
  if (isMasterTab && localStorage.getItem("meetloop_active_tab") === myTabId) {
    localStorage.setItem("meetloop_tab_ping", Date.now().toString());
  }
}, 1200);

window.addEventListener("storage", (e) => {
  if (e.key === "meetloop_active_tab" && e.newValue && e.newValue !== myTabId) {
    isMasterTab = false;
    showDuplicateTabBlocker();
  }
});

window.addEventListener("pagehide", () => {
  if (isMasterTab) {
    localStorage.removeItem("meetloop_active_tab");
    localStorage.removeItem("meetloop_tab_ping");
  }
});

/* ================= 2. NUMBERS-ONLY INPUTS ================= */
const gcashPhoneInput = document.getElementById("gcashPhoneInput");
const gcashRefInput = document.getElementById("gcashRefInput");

[gcashPhoneInput, gcashRefInput].forEach(input => {
  input.addEventListener("input", (e) => {
    const clean = e.target.value.replace(/[^0-9]/g, "");
    if (e.target.value !== clean) e.target.value = clean;
  });
});

/* ================= 3. SOCKET CONNECTION & RECOVERY ================= */
let socket = null;
try {
  if (typeof io !== "undefined") {
    socket = io({
      transports: ["websocket", "polling"],
      query: { hardwareId: myHardwareId, deviceId: myHardwareId }
    });
  }
} catch(e){}

const crtWrapper = document.getElementById("crtWrapper");
const crtStaticCanvas = document.getElementById("crtStaticCanvas");
const standbyCenter = document.getElementById("standbyCenter");
const searchLoader = document.getElementById("searchLoader");
const remoteVideo = document.getElementById("remoteVideo");
const localVideo = document.getElementById("localVideo");
const localCamBox = document.getElementById("localCamBox");

const remoteStatus = document.getElementById("remoteStatus");
const mainActionBtn = document.getElementById("mainActionBtn");
const stopBtn = document.getElementById("stopBtn");
const micBtn = document.getElementById("micBtn");
const flipBtn = document.getElementById("flipBtn");
const reportBtn = document.getElementById("reportBtn");

const chatStream = document.getElementById("chatStream");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");

const audioSlider = document.getElementById("audioSlider");
const speakerIcon = document.getElementById("speakerIcon");
const standbyUsers = document.getElementById("standbyUsers");

let localStream = null;
let peerConnection = null;
let dataChannel = null;
let searching = false;
let connected = false;
let currentFacingMode = "user";
let blurTimer = null;
let pendingCandidates = [];
let submitAttempts = 0;
let cooldownTimer = null;
let lastCapturedStrangerSnapshot = null;

if (socket) {
  socket.on("connect", () => {
    socket.emit("check-ban-status", { hardwareId: myHardwareId });
  });

  socket.on("online-count", (count) => {
    const realCount = Math.max(1, Number(count || 1));
    if (standbyUsers) standbyUsers.textContent = realCount.toLocaleString();
  });

  socket.on("waiting", () => {
    searching = true;
    enableBlur();
    crtWrapper.style.display = "block";
    standbyCenter.style.display = "none";
    searchLoader.style.display = "flex";
    remoteStatus.textContent = getTranslatedText("searching");
  });

  socket.on("match", async (data) => {
    searching = false;
    enableBlur();
    await createPeer(Boolean(data?.initiator));
  });

  socket.on("signal", async (data) => {
    try {
      if (data.type === "offer") {
        if (!peerConnection) await createPeer(false);
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        while (pendingCandidates.length > 0) {
          await peerConnection.addIceCandidate(pendingCandidates.shift()).catch(()=>{});
        }
        const ans = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(ans);
        socket.emit("signal", { type: "answer", answer: ans });
      } else if (data.type === "answer" && peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        while (pendingCandidates.length > 0) {
          await peerConnection.addIceCandidate(pendingCandidates.shift()).catch(()=>{});
        }
      } else if (data.type === "candidate") {
        const candidate = new RTCIceCandidate(data.candidate);
        if (peerConnection && peerConnection.remoteDescription) {
          await peerConnection.addIceCandidate(candidate).catch(()=>{});
        } else {
          pendingCandidates.push(candidate);
        }
      }
    } catch(err){}
  });

  socket.on("partner-disconnected", () => {
    addChatMessage("MeetLoop", getTranslatedText("partnerDisconnected"));
    triggerStartNext();
  });

  socket.on("ip-banned", (data) => {
    display7DayBanScreen(data.banUntil, data.reason, data.snapshot);
  });

  socket.on("unban-pending", (data) => {
    const status = document.getElementById("gcashRefStatus");
    status.style.color = "#0284c7";
    status.innerHTML = `⏳ <b>${getTranslatedText("detailsLogged")} (${4 - submitAttempts} ${getTranslatedText("triesLeft")})</b>`;
    document.getElementById("banOverlay").style.display = "flex";
  });

  socket.on("real-admin-unban-signal", (data) => {
    if (data && data.hardwareId && data.hardwareId === myHardwareId) {
      isCurrentlyBanned = false;
      localStorage.removeItem("meetloop_ban_until");
      localStorage.removeItem("meetloop_ban_reason");
      localStorage.removeItem("meetloop_ban_snapshot");
      if (cooldownTimer) { clearInterval(cooldownTimer); cooldownTimer = null; }
      submitAttempts = 0;
      
      const status = document.getElementById("gcashRefStatus");
      status.style.color = "#16a34a";
      status.textContent = "✅ " + getTranslatedText("unbanSuccess");

      myHardwareId = getPersistentDeviceId(true);
      updateNumericDisplayId();
      if (tabChannel) tabChannel.postMessage({ type: "UNBAN_EVENT" });

      setTimeout(() => {
        document.getElementById("banOverlay").style.display = "none";
        alert("🎉 " + getTranslatedText("unbanAlert"));
      }, 800);
    }
  });

  socket.on("unban-response", (data) => {
    const status = document.getElementById("gcashRefStatus");
    if (!data.success) {
      status.style.color = "#dc2626";
      status.textContent = data.message;
    }
  });

  socket.on("report-success", () => {
    addChatMessage("MeetLoop", "User reported successfully.");
  });
}

/* ================= 4. PERIODIC AUTO-CHECK UNBAN STATUS ================= */
setInterval(() => {
  if (isCurrentlyBanned && socket && socket.connected) {

  }
}, 2500);

function runTVStatic() {
  if (!crtStaticCanvas) return;
  const ctx = crtStaticCanvas.getContext("2d");
  const w = (crtStaticCanvas.width = 240);
  const h = (crtStaticCanvas.height = 180);
  const imgData = ctx.createImageData(w, h);
  const buffer = new Uint32Array(imgData.data.buffer);
  const len = buffer.length;

  function noise() {
    if (crtWrapper && crtWrapper.style.display !== "none") {
      for (let i = 0; i < len; i++) {
        const gray = (Math.random() * 255) | 0;
        buffer[i] = (255 << 24) | (gray << 16) | (gray << 8) | gray;
      }
      ctx.putImageData(imgData, 0, 0);
    }
    requestAnimationFrame(noise);
  }
  noise();
}
runTVStatic();

function captureStrangerSnapshot() {
  const canvas = document.createElement("canvas");
  canvas.width = 180; canvas.height = 180;
  const ctx = canvas.getContext("2d");

  if (remoteVideo && remoteVideo.videoWidth > 0) {
    ctx.drawImage(remoteVideo, 0, 0, 180, 180);
    return canvas.toDataURL("image/jpeg", 0.75);
  } else if (localVideo && localVideo.videoWidth > 0) {
    ctx.drawImage(localVideo, 0, 0, 180, 180);
    return canvas.toDataURL("image/jpeg", 0.75);
  }
  return null;
}

function display7DayBanScreen(banUntil, reason = "Policy Violation", customSnap = null) {
  isCurrentlyBanned = true;
  stopSession();

  const finalBanUntil = (!banUntil || isNaN(banUntil)) ? (Date.now() + 7 * 24 * 60 * 60 * 1000) : banUntil;
  localStorage.setItem("meetloop_ban_until", finalBanUntil.toString());
  localStorage.setItem("meetloop_ban_reason", reason);
  if (customSnap) localStorage.setItem("meetloop_ban_snapshot", customSnap);

  document.getElementById("banReasonLabel").textContent = reason;
  const unbanDate = new Date(finalBanUntil);
  const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  document.getElementById("banUntilFullText").textContent = unbanDate.toLocaleDateString([], options);

  const banCanvas = document.getElementById("banCanvas");
  const ctx = banCanvas.getContext("2d");
  const snapshotToRender = customSnap || localStorage.getItem("meetloop_ban_snapshot");

  if (snapshotToRender) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, 95, 95); };
    img.src = snapshotToRender;
  } else {
    ctx.fillStyle = "#1e293b"; ctx.fillRect(0, 0, 95, 95);
    ctx.fillStyle = "#94a3b8"; ctx.font = "bold 9px sans-serif";
    ctx.fillText("Evidence Logged", 6, 50);
  }

  backToMethodSelection();
  document.getElementById("banOverlay").style.display = "flex";
}

function openGcashPayView() {
  document.getElementById("selectMethodSection").style.display = "none";
  document.getElementById("gcashPaySection").style.display = "flex";
  document.getElementById("gcashPhoneInput").value = "";
  document.getElementById("gcashRefInput").value = "";
  document.getElementById("gcashRefStatus").textContent = "";
  
  if (!cooldownTimer) {
    const btn = document.getElementById("gcashVerifyBtn");
    btn.disabled = false;
    btn.textContent = getTranslatedText("verifyBtn");
    document.getElementById("gcashPhoneInput").disabled = false;
    document.getElementById("gcashRefInput").disabled = false;
  }
}

function backToMethodSelection() {
  document.getElementById("gcashPaySection").style.display = "none";
  document.getElementById("selectMethodSection").style.display = "flex";
}

function start30SecondCooldown() {
  const btn = document.getElementById("gcashVerifyBtn");
  const phoneInput = document.getElementById("gcashPhoneInput");
  const refInput = document.getElementById("gcashRefInput");
  const status = document.getElementById("gcashRefStatus");

  btn.disabled = true; phoneInput.disabled = true; refInput.disabled = true;

  let timeLeft = 30;
  if (cooldownTimer) clearInterval(cooldownTimer);

  cooldownTimer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(cooldownTimer);
      cooldownTimer = null;
      submitAttempts = 0;
      btn.disabled = false; phoneInput.disabled = false; refInput.disabled = false;
      btn.textContent = `${getTranslatedText("verifyBtn")} (4 ${getTranslatedText("triesLeft")})`;
      status.style.color = "#16a34a";
      status.textContent = "✅ Cooldown ended. You may now submit again.";
    } else {
      btn.textContent = `⏳ Locked: Wait ${timeLeft}s`;
      status.style.color = "#dc2626";
      status.innerHTML = `⚠️ <b>Max 4 tries reached!</b><br>Please wait <b>${timeLeft}s</b> before submitting again...`;
    }
  }, 1000);
}

function submitGCashUnbanTicket() {
  if (cooldownTimer) return;

  const phoneInput = document.getElementById("gcashPhoneInput");
  const refInput = document.getElementById("gcashRefInput");
  const status = document.getElementById("gcashRefStatus");

  const phoneVal = phoneInput.value.trim().replace(/[^0-9]/g, "");
  const refVal = refInput.value.trim().replace(/[^0-9]/g, "");

  if (!phoneVal || phoneVal.length < 10) {
    status.style.color = "#dc2626";
    status.textContent = "❌ Please enter a valid 11-digit GCash Mobile Number (e.g. 09123456789).";
    return;
  }

  submitAttempts++;
  if (submitAttempts >= 4) {
    start30SecondCooldown();
    return;
  }

  const remaining = 4 - submitAttempts;
  status.style.color = "#0284c7";
  status.innerHTML = `⏳ <b>Matching details... (${remaining} ${getTranslatedText("triesLeft")})</b>`;

  document.getElementById("banOverlay").style.display = "flex";

  if (socket && socket.connected) {
    socket.emit("unban-request", { hardwareId: myHardwareId, phone: phoneVal, ref: refVal });
  } else {
    status.style.color = "#dc2626";
    status.textContent = "❌ Server connection lost. Please reload and try again.";
  }
}

async function startMedia() {
  if (isCurrentlyBanned) {
    document.getElementById("banOverlay").style.display = "flex";
    return false;
  }

  if (localStream && localStream.getVideoTracks().some(t => t.readyState === "live")) {
    if (localVideo.srcObject !== localStream) localVideo.srcObject = localStream;
    try { await localVideo.play(); } catch(e){}
    return true;
  }

  const constraints = {
    video: { width: { ideal: 640, max: 1280 }, height: { ideal: 480, max: 720 }, frameRate: { ideal: 30, max: 30 }, facingMode: { ideal: currentFacingMode } },
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  };

  try {
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    localVideo.srcObject = localStream;
    localVideo.className = currentFacingMode === "user" ? "mirrored" : "unmirrored";
    try { await localVideo.play(); } catch(e){}
    return true;
  } catch(err) {
    return false;
  }
}

function enableBlur() {
  if (blurTimer) clearTimeout(blurTimer);
  remoteVideo.classList.remove("remote-clear");
  remoteVideo.classList.add("remote-blur");
}

function releaseBlur() {
  if (blurTimer) clearTimeout(blurTimer);
  blurTimer = setTimeout(() => {
    remoteVideo.classList.remove("remote-blur");
    remoteVideo.classList.add("remote-clear");
  }, 200);
}

async function triggerStartNext() {
  if (isCurrentlyBanned) {
    document.getElementById("banOverlay").style.display = "flex";
    return;
  }

  const ok = await startMedia();
  if (!ok) return;

  mainActionBtn.disabled = true;
  crtWrapper.style.display = "block";
  standbyCenter.style.display = "none";
  searchLoader.style.display = "flex";
  enableBlur();

  closePeerConnection();

  connected = false;
  searching = true;
  remoteStatus.textContent = getTranslatedText("searching");
  mainActionBtn.textContent = getTranslatedText("next");
  mainActionBtn.disabled = false;
  stopBtn.disabled = false;

  if (socket && socket.connected) socket.emit("skip");
}

function stopSession() {
  searching = false;
  connected = false;

  crtWrapper.style.display = "block";
  standbyCenter.style.display = "flex";
  searchLoader.style.display = "none";
  enableBlur();

  if (socket) socket.emit("stop-search");
  closePeerConnection();

  remoteStatus.textContent = getTranslatedText("stopped");
  mainActionBtn.textContent = getTranslatedText("start");
  mainActionBtn.disabled = false;

}

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "turn:standard.relay.metered.ca:80", username: "0974f7094bbb79185dd1d4ce", credential: "jqFOtepU3tMVTfEX" }
  ]
};

async function createPeer(initiator) {
  closePeerConnection();
  pendingCandidates = [];
  peerConnection = new RTCPeerConnection(rtcConfig);

  if (localStream) {
    localStream.getTracks().forEach(track => { peerConnection.addTrack(track, localStream); });
  }

  peerConnection.onicecandidate = (e) => {
    if (e.candidate && socket && socket.connected) {
      socket.emit("signal", { type: "candidate", candidate: e.candidate });
    }
  };

  peerConnection.ontrack = (e) => {
    crtWrapper.style.display = "none";
    standbyCenter.style.display = "none";
    searchLoader.style.display = "none";
    remoteStatus.textContent = "Live";

    if (e.streams && e.streams[0]) {
      remoteVideo.srcObject = e.streams[0];
    } else {
      if (!remoteVideo.srcObject) remoteVideo.srcObject = new MediaStream();
      remoteVideo.srcObject.addTrack(e.track);
    }
    remoteVideo.play().catch(()=>{});
    releaseBlur();
  };

  peerConnection.onconnectionstatechange = () => {
    if (peerConnection?.connectionState === "connected") {
      connected = true; searching = false;
      crtWrapper.style.display = "none"; standbyCenter.style.display = "none"; searchLoader.style.display = "none";
      reportBtn.disabled = false;
      releaseBlur();
    } else if (peerConnection?.connectionState === "disconnected" || peerConnection?.connectionState === "failed") {
      triggerStartNext();
    }
  };

  if (initiator) {
    dataChannel = peerConnection.createDataChannel("chat");
    setupDataChannel(dataChannel);
    try {
      const offer = await peerConnection.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
      await peerConnection.setLocalDescription(offer);
      socket.emit("signal", { type: "offer", offer: offer });
    } catch(err){}
  } else {
    peerConnection.ondatachannel = (e) => setupDataChannel(e.channel);
  }
}

function setupDataChannel(ch) {
  dataChannel = ch;
  ch.onmessage = (e) => addChatMessage(getTranslatedText("stranger"), e.data);
}

function closePeerConnection() {
  if (dataChannel) { try{ dataChannel.close(); }catch(e){} dataChannel = null; }
  if (peerConnection) {
    try {
      peerConnection.ontrack = null;
      peerConnection.onicecandidate = null;
      peerConnection.onconnectionstatechange = null;
      peerConnection.close();
    }catch(e){}
    peerConnection = null;
  }
  if (remoteVideo.srcObject) remoteVideo.srcObject = null;
  pendingCandidates = [];
}

  document.getElementById("stopBtn").textContent = t.stop;
  document.getElementById("lblOnlineText").textContent = t.onlineUsers;
  document.getElementById("lblChatTitle").textContent = t.chatTitle;
  document.getElementById("chatInput").placeholder = t.chatPlaceholder;
  document.getElementById("sendBtn").textContent = t.send;
  document.getElementById("lblSelectMethod").textContent = t.selectMethod;
  document.getElementById("lblGcashTitle").textContent = t.gcashTitle;
  document.getElementById("lblGcashDesc").textContent = t.gcashDesc;
  document.getElementById("lblWaitTitle").textContent = t.waitTitle;
  document.getElementById("lblWaitDesc").textContent = t.waitDesc;
  document.getElementById("lblScanText").innerHTML = t.scanText;
  document.getElementById("lblExpiresHeader").textContent = t.expiresHeader;
  document.getElementById("lblEvidenceTag").textContent = t.evidenceTag;
  document.getElementById("lblEncounterSnapshot").textContent = t.encounterSnapshot;
  document.getElementById("lblDisclaimerTitle").textContent = t.disclaimerTitle;
  document.getElementById("lblDisclaimerBody").innerHTML = t.disclaimerBody;
  document.getElementById("lblFeeTag").textContent = t.feeTag;
  document.getElementById("btnBackMethods").textContent = t.backMethods;
  document.getElementById("lblTabLockTitle").textContent = t.tabLockTitle;
  document.getElementById("lblTabLockDesc").textContent = t.tabLockDesc;
  document.getElementById("btnClaimTab").textContent = t.tabLockBtn;
  document.getElementById("remoteTag").textContent = t.stranger;
  document.getElementById("localTag").textContent = t.you;
  document.getElementById("showLocalBtn").textContent = t.showCam;
  document.getElementById("flipBtn").textContent = t.flip;
  document.getElementById("banTitle").textContent = t.banTitle;
  document.getElementById("lblDeviceBanId").textContent = t.deviceBanId;
  document.getElementById("lblBanReason").innerHTML = `${t.banReason} <span id="banReasonLabel">${savedBanReason}</span>`;
  document.getElementById("lblTelegramSupport").querySelector("span").textContent = t.telegramSupport;

  document.getElementById("gcashPhoneInput").placeholder = t.phonePlaceholder;
  document.getElementById("gcashRefInput").placeholder = t.refPlaceholder;

  if (!cooldownTimer && !document.getElementById("gcashVerifyBtn").disabled) {
    document.getElementById("gcashVerifyBtn").textContent = t.verifyBtn;
  }
  if (!searching && !connected) {
    mainActionBtn.textContent = t.start;
  } else if (searching) {
    mainActionBtn.textContent = t.next;
  }
}

document.getElementById("languageSelect").addEventListener("change", (e) => {
  setLanguage(e.target.value);
});

/* ================= 6. REPORT MODAL HANDLERS ================= */
function openReportModal() {
  if (!connected) return;
  lastCapturedStrangerSnapshot = captureStrangerSnapshot();
  document.getElementById("reportModal").style.display = "flex";
}

function closeReportModal() {
  document.getElementById("reportModal").style.display = "none";
}

function confirmReportUser() {
  const reason = document.getElementById("reportReasonSelect").value;
  closeReportModal();

  if (socket) {
    socket.emit("report-user", { reason: reason, snapshot: lastCapturedStrangerSnapshot });
  }
  reportBtn.disabled = true;
  triggerStartNext();
}

/* ================= 7. CHAT & UI EVENTS ================= */
function addChatMessage(author, msg) {
  const div = document.createElement("div");
  div.className = "chat-msg";
  div.innerHTML = `<div class="chat-author">${author}</div><div class="chat-bubble">${msg.replace(/[&<>'"]/g, "")}</div>`;
  chatStream.appendChild(div);
  chatStream.scrollTop = chatStream.scrollHeight;
}

function sendChat() {
  const val = chatInput.value.trim();
  if (!val || !dataChannel || dataChannel.readyState !== "open") return;
  dataChannel.send(val);
  addChatMessage(getTranslatedText("you"), val);
  chatInput.value = "";
}

document.getElementById("portalStartBtn").addEventListener("click", async () => {
  document.getElementById("welcomePortal").style.display = "none";
  if (!isCurrentlyBanned) {
    await startMedia();
  }
});

mainActionBtn.addEventListener("click", triggerStartNext);
stopBtn.addEventListener("click", stopSession);
sendBtn.addEventListener("click", sendChat);
chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); sendChat(); } });

micBtn.addEventListener("click", () => {
  const t = localStream?.getAudioTracks()[0];
  if (t) { 
    t.enabled = !t.enabled; 
    micBtn.textContent = t.enabled ? getTranslatedText("micOn") : getTranslatedText("micOff"); 
  }
});

flipBtn.addEventListener("click", async () => {
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  const oldTrack = localStream?.getVideoTracks()[0];
  if (oldTrack) oldTrack.stop();
  await startMedia();
  if (peerConnection && localStream) {
    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === "video");
    if (sender) sender.replaceTrack(localStream.getVideoTracks()[0]);
  }
});

reportBtn.addEventListener("click", openReportModal);

audioSlider.addEventListener("input", (e) => {
  const v = parseFloat(e.target.value);
  if (remoteVideo) remoteVideo.volume = v;
});

speakerIcon.addEventListener("click", () => {
  const current = parseFloat(audioSlider.value);
  const nextVal = current > 0 ? 0 : 1.0;
  audioSlider.value = nextVal;
  if (remoteVideo) remoteVideo.volume = nextVal;
});

document.getElementById("hideLocalBtn").addEventListener("click", () => {
  localCamBox.classList.add("hidden-cam");
  document.getElementById("showLocalBtn").classList.add("visible");
});
document.getElementById("showLocalBtn").addEventListener("click", () => {
  localCamBox.classList.remove("hidden-cam");
  document.getElementById("showLocalBtn").classList.remove("visible");
});

// STARTUP (DEFAULT ENGLISH)
checkMultiTabConflict();
const initialLang = localStorage.getItem("meetloop_lang") || "en";
setLanguage(initialLang);
</script>
